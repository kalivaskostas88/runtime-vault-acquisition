name: ACE S05E exact public audio window recovery
on:
  push:
    branches: [research/ace-s05e-20260922]
    paths: ['.github/workflows/ace_s05e_hls_windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ace-hls/out"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python3 -m venv "$RUNNER_TEMP/ace-hls/venv"
          "$RUNNER_TEMP/ace-hls/venv/bin/pip" install --disable-pip-version-check 'yt-dlp[default]==2026.8.19'
      - name: Download only required public HLS fragments
        env:
          ROOT: ${{ runner.temp }}/ace-hls
        run: |
          "$ROOT/venv/bin/python" - <<'PY'
          import os,pathlib,subprocess,json,urllib.request,urllib.parse,re,hashlib,datetime,shutil
          root=pathlib.Path(os.environ['ROOT']);out=root/'out';source='https://soundcloud.com/soundonsound/ace-studio-audio-example-03';result={'source_url':source,'run_id':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA'),'status':'SOURCE_INGEST_FAILED','windows':[]}
          def get(url,cap=5*1024*1024):
            assert urllib.parse.urlsplit(url).scheme=='https'
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ACE-public-media-research/1.0'}),timeout=20) as f:b=f.read(cap+1)
            if len(b)>cap:raise RuntimeError('response_size_limit')
            return b
          def cmd(args,timeout=40):return subprocess.run(args,check=True,capture_output=True,text=True,timeout=timeout)
          try:
            cp=cmd([str(root/'venv/bin/yt-dlp'),'--ignore-config','--no-playlist','--skip-download','--dump-single-json','--socket-timeout','12','--retries','1','-f','bestaudio',source],60);j=json.loads(cp.stdout)
            url=j['url'];playlist=get(url,2*1024*1024).decode();master_hash=hashlib.sha256(playlist.encode()).hexdigest()
            if '#EXT-X-STREAM-INF' in playlist:
              lines=playlist.splitlines();url=urllib.parse.urljoin(url,next(x for x in lines if x and not x.startswith('#')));playlist=get(url,2*1024*1024).decode()
            if '#EXTM3U' not in playlist:raise RuntimeError('not_hls')
            if any('METHOD=NONE' not in x for x in playlist.splitlines() if x.startswith('#EXT-X-KEY')):raise RuntimeError('encrypted_media_not_admitted')
            if '#EXT-X-BYTERANGE' in playlist or '#EXT-X-DISCONTINUITY' in playlist:raise RuntimeError('unsupported_range_or_discontinuity_contract')
            match=re.search(r'#EXT-X-MAP:.*?URI="([^"]+)"',playlist)
            if not match:raise RuntimeError('expected_fmp4_init_map')
            init=get(urllib.parse.urljoin(url,match.group(1)));total=0.;duration=None;segs=[]
            for line in playlist.splitlines():
              if line.startswith('#EXTINF:'):duration=float(line.split(':')[1].split(',')[0])
              elif line and not line.startswith('#') and duration is not None:
                segs.append({'url':urllib.parse.urljoin(url,line),'start':total,'duration':duration});total+=duration;duration=None
            result.update(playlist_sha256=hashlib.sha256(playlist.encode()).hexdigest(),master_sha256=master_hash,source_duration_seconds=total,selected_format_id=j.get('format_id'),init_sha256=hashlib.sha256(init).hexdigest(),protection='No EXT-X-KEY encryption; no auth/cookies/proxy/DRM bypass')
            for sid,a,b in [('SOS3_NAV_B',32.,55.),('SOS3_NAV_C',69.,92.),('SOS3_NAV_D',106.,129.)]:
              d=out/sid;d.mkdir();w={'id':sid,'requested_source_window':[a,b],'status':'SOURCE_INGEST_FAILED'}
              selected=[s for s in segs if s['start']<b and s['start']+s['duration']>a]
              if not selected:raise RuntimeError('no_matching_fragments')
              temp=root/(sid+'.mp4');frag_records=[]
              with temp.open('wb') as f:
                f.write(init)
                for s in selected:
                  raw=get(s['url']);f.write(raw);frag_records.append({'start':s['start'],'duration':s['duration'],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              pr=json.loads(cmd(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(temp)],20).stdout)
              if not any(s.get('codec_type')=='audio' for s in pr.get('streams',[])):raise RuntimeError('no_audio_in_fragments')
              offset=a-selected[0]['start'];length=b-a
              command=['ffmpeg','-nostdin','-v','error','-i',str(temp),'-map','0:a:0','-af',f'asetpts=PTS-STARTPTS,atrim=start={offset:.9f}:duration={length:.9f},asetpts=PTS-STARTPTS','-c:a','pcm_s16le',str(d/'audio.wav')]
              cmd(command,40);probe=json.loads(cmd(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(d/'audio.wav')],15).stdout)
              if abs(float(probe['format']['duration'])-length)>0.05:raise RuntimeError('decoded_duration_mismatch')
              w.update(status='AUDIO_ONLY_INGESTED',fragment_records=frag_records,trim_offset_from_first_fragment=offset,first_fragment_source_start=selected[0]['start'],joined_ffprobe=pr,output_ffprobe=probe,audio_sha256=hashlib.sha256((d/'audio.wav').read_bytes()).hexdigest(),transform='selected original fMP4 fragments+init; timestamp rebase; PCM16 decode and bounded trim; no gain/timewarp/denoise',source_alignment='playlist EXTINF mapping; inter-stage musical alignment still UNVERIFIED',perceptual_audio='NOT_EVALUATED')
              (d/'receipt.json').write_text(json.dumps(w,indent=2));result['windows'].append(w);temp.unlink();print(sid,w['status'])
            result['status']='PUBLIC_AUDIO_WINDOWS_INGESTED'
          except Exception as e:result['error']=re.sub(r'https?://[^\s]+','[URL_REDACTED]',str(e))
          result['utc']=datetime.datetime.now(datetime.timezone.utc).isoformat();(out/'results.json').write_text(json.dumps(result,indent=2));print(result['status'],result.get('error',''))
          PY
      - name: One-day bounded transport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ace-s05e-hls-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/ace-hls/out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
