name: ACE S09 historical parameter effect learning ingest
on:
  push:
    branches: [research/ace-s05e-20260922]
    paths: ['.github/workflows/ace_s05e_ingest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare bounded ffmpeg
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ace-s09/out"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Acquire one exact historical ACE technology preview
        env:
          ROOT: ${{ runner.temp }}/ace-s09
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,os,pathlib,hashlib,datetime,subprocess,signal,resource,socket,ipaddress,re
          root=pathlib.Path(os.environ['ROOT']);out=root/'out'; bvid='BV1za411C7vw'; src='https://www.bilibili.com/video/'+bvid+'/'
          expected_title='【ACE技术预览】AI吐字、气声、假声、松弛参数调节'
          rec={'source_url':src,'source_id':bvid,'status':'SOURCE_INGEST_FAILED','scope':'historical ACE technology preview for parameter-effect learning only; not current UI/calibration','run_id':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA')}
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'ACE-public-media-research/1.0'})
            with urllib.request.urlopen(req,timeout=20) as f:b=f.read(2*1024*1024+1)
            if len(b)>2*1024*1024:raise RuntimeError('size_limit')
            j=json.loads(b)
            if j.get('code')!=0:raise RuntimeError('api_denied:'+str(j.get('code'))+':'+str(j.get('message')))
            return j['data'],hashlib.sha256(b).hexdigest()
          def limits():resource.setrlimit(resource.RLIMIT_FSIZE,(160*1024*1024,160*1024*1024))
          def run(a,t):
            p=subprocess.Popen(a,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,start_new_session=True,preexec_fn=limits)
            try:s,e=p.communicate(timeout=t);return p.returncode,s,e
            except subprocess.TimeoutExpired:
              os.killpg(p.pid,signal.SIGKILL);s,e=p.communicate();return 124,s,e+'\nTIME_LIMIT'
          def clean(s):return re.sub(r'https?://[^\s\"\']+','[MEDIA_URL_REDACTED]',s)[-6000:]
          try:
            data,mh=get('https://api.bilibili.com/x/web-interface/view?bvid='+bvid)
            if data.get('bvid')!=bvid or data.get('title')!=expected_title or (data.get('rights') or {}).get('pay'):raise RuntimeError('identity_or_access_mismatch')
            duration=float(data.get('duration') or 0)
            if not 0<duration<=420:raise RuntimeError('duration_limit')
            cid=data.get('cid');rec.update(title=data.get('title'),description=data.get('desc'),duration=duration,pubdate=data.get('pubdate'),owner=data.get('owner'),cid=cid,metadata_sha256=mh,rights=data.get('rights'))
            player,ph=get('https://api.bilibili.com/x/player/playurl?'+urllib.parse.urlencode({'bvid':bvid,'cid':cid,'qn':32,'fnval':16,'fourk':0}))
            dash=player.get('dash') or {};vs=[s for s in dash.get('video',[]) if s.get('height',9999)<=480 and str(s.get('codecs','')).startswith('avc')];ads=[s for s in dash.get('audio',[]) if s.get('codecs')=='mp4a.40.2']
            if not vs or not ads:raise RuntimeError('public_AV_missing')
            streams=[max(vs,key=lambda s:s.get('height',0)),max(ads,key=lambda s:s.get('bandwidth',0))];urls=[]
            for s in streams:
              u=urllib.parse.urljoin(src,s.get('baseUrl') or s.get('base_url'));parts=urllib.parse.urlsplit(u)
              if parts.scheme not in ['http','https'] or not parts.hostname:raise RuntimeError('invalid_url')
              addrs={x[4][0] for x in socket.getaddrinfo(parts.hostname,parts.port or (443 if parts.scheme=='https' else 80))}
              if any(not ipaddress.ip_address(x).is_global for x in addrs):raise RuntimeError('nonpublic_destination')
              urls.append(u)
            headers=['-user_agent','ACE-public-media-research/1.0','-headers','Referer: https://www.bilibili.com/\r\n','-rw_timeout','20000000']
            args=['ffmpeg','-nostdin','-v','warning','-copyts']+headers+['-i',urls[0]]+headers+['-i',urls[1],'-map','0:v:0','-map','1:a:0','-c','copy','-copytb','1','-avoid_negative_ts','disabled','-to',str(duration+0.5),str(out/'preview.mkv')]
            rc,s,e=run(args,220);(out/'remux.log').write_text(clean(e))
            if rc:raise RuntimeError('remux_failed:'+str(rc))
            rc,s,e=run(['ffmpeg','-nostdin','-v','error','-i',str(out/'preview.mkv'),'-map','0:a:0','-vn','-c:a','pcm_s16le',str(out/'audio.wav')],45)
            if rc:raise RuntimeError('audio_decode_failed')
            frames=out/'frames';frames.mkdir()
            rc,s,e=run(['ffmpeg','-nostdin','-v','error','-i',str(out/'preview.mkv'),'-vf','fps=1/2','-q:v','2',str(frames/'f_%03d.jpg')],75)
            if rc:raise RuntimeError('frames_failed')
            rec.update(status='SAME_SOURCE_AV_INGESTED',player_response_sha256=ph,transform='stream-copy remux preserving source timing; PCM16 decode; orientation frames 0.5fps',hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in [out/'preview.mkv',out/'audio.wav']})
          except Exception as e:rec['error']=clean(str(e))
          rec['utc']=datetime.datetime.now(datetime.timezone.utc).isoformat();(out/'receipt.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2));print(json.dumps(rec,ensure_ascii=False,indent=2))
          PY
      - name: One-day S09 transport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ace-s09-parameter-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/ace-s09/out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
