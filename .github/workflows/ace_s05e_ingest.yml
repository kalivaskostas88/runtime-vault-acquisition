name: ACE S05F single-source bounded AV ingress
on:
  push:
    branches: [research/ace-s05e-20260922]
    paths: ['.github/workflows/ace_s05e_ingest.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ace-s05e-ingress
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Reuse bounded media tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ace-s05f/out"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python3 -m venv "$RUNNER_TEMP/ace-s05f/venv"
          "$RUNNER_TEMP/ace-s05f/venv/bin/pip" install --disable-pip-version-check 'yt-dlp[default]==2026.8.19'
      - name: Acquire the selected same-source window and preserve timing metadata
        env:
          ROOT: ${{ runner.temp }}/ace-s05f
        shell: bash
        run: |
          set -euo pipefail
          "$ROOT/venv/bin/python" - <<'PY'
          import datetime,hashlib,json,math,os,pathlib,re,resource,signal,subprocess
          root=pathlib.Path(os.environ['ROOT']);out=root/'out';out.mkdir(exist_ok=True);ytdlp=root/'venv/bin/yt-dlp'
          manifest={'run_label':'S05F_INGEST_R001','reuses':'S05E bounded ingress','retention_policy':'one_day_transport_only','need_video':True,'need_audio':True,'frame_strategy':'no remote image extraction; preserve frame PTS then adaptive local review','sources':[{'source_id':'SV02_TENSION_PRIMARY','source_url':'https://www.youtube.com/watch?v=l_MiuyhsgfU','start_time':440,'end_time':505,'expected_content':'previously indexed Tension edit around 07:29-08:15; all actual playback and action boundaries UNASSIGNED until media inspection','source_binding':'prior-candidate navigation page https://lilys.ai/ko/notes/755229 links this unique original id; transcript not used as visual/audio evidence'}]}
          (out/'source_manifest.json').write_text(json.dumps(manifest,indent=2))
          base=[str(ytdlp),'--ignore-config','--no-playlist','--no-progress','--no-cache-dir','--socket-timeout','15','--retries','1','--fragment-retries','1','--extractor-retries','1','--js-runtimes','node']
          def limits():resource.setrlimit(resource.RLIMIT_FSIZE,(128*1024*1024,128*1024*1024))
          def run(args,timeout):
            p=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,start_new_session=True,preexec_fn=limits)
            try:a,b=p.communicate(timeout=timeout);return p.returncode,a,b
            except subprocess.TimeoutExpired:
              os.killpg(p.pid,signal.SIGKILL);a,b=p.communicate();return 124,a,b+'\nBOUNDED_TIMEOUT'
          def safe_error(s):return re.sub(r'https?://[^\s]+','[URL_REDACTED]',s)[-7000:]
          env={'github_run_id':os.environ.get('GITHUB_RUN_ID'),'github_sha':os.environ.get('GITHUB_SHA'),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'yt_dlp':run([str(ytdlp),'--version'],10)[1].strip(),'ffmpeg':run(['ffmpeg','-version'],10)[1].splitlines()[0],'perceptual_audio':'NOT_EVALUATED','own_ace_renders':0}
          (out/'environment.json').write_text(json.dumps(env,indent=2));results=[]
          for src in manifest['sources']:
            d=out/src['source_id'];d.mkdir();rec={'request':src,'status':'SOURCE_INGEST_FAILED'}
            try:
              start=float(src['start_time']);end=float(src['end_time']);assert 0<=start<end and end-start<=90
              assert re.fullmatch(r'https://www\.youtube\.com/watch\?v=[A-Za-z0-9_-]{11}',src['source_url'])
              rc,stdout,stderr=run(base+['--skip-download','--dump-single-json',src['source_url']],70);(d/'probe.log').write_text(safe_error(stderr))
              if rc:raise RuntimeError('metadata_probe_failed:'+str(rc))
              info=json.loads(stdout);publicmeta={k:info.get(k) for k in ['id','title','uploader','uploader_id','channel','channel_id','webpage_url','upload_date','duration','availability','is_live','live_status','age_limit','chapters']}
              (d/'metadata.json').write_text(json.dumps(publicmeta,ensure_ascii=False,indent=2))
              if info.get('is_live') or info.get('live_status') in ['is_live','is_upcoming'] or (info.get('age_limit') or 0)>0 or info.get('availability') in ['private','needs_auth','subscriber_only','premium_only']:raise RuntimeError('restricted_source_not_admitted')
              if info.get('duration') is not None:
                if float(info['duration'])<=start:raise RuntimeError('range_outside_source')
                end=min(end,float(info['duration']))
              rec['requested_resolved_window_seconds']=[start,end]
              args=base+['-f','bv*[height<=720]+ba/b[height<=720]','--download-sections',f'*{start}-{end}','--force-keyframes-at-cuts','--merge-output-format','mkv','-o',str(d/'segment.%(ext)s'),src['source_url']]
              (d/'acquisition_command.json').write_text(json.dumps(args,indent=2))
              rc,stdout,stderr=run(args,180);(d/'ingest.log').write_text(safe_error(stdout+'\n'+stderr))
              if rc:raise RuntimeError('section_download_failed:'+str(rc))
              media=[p for p in d.glob('segment.*') if p.suffix in ['.mp4','.mkv','.webm','.mov']]
              if len(media)!=1:raise RuntimeError('one_segment_expected')
              m=media[0];rc,pj,err=run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(m)],20)
              if rc:raise RuntimeError('ffprobe_failed')
              probe=json.loads(pj);(d/'ffprobe.json').write_text(json.dumps(probe,indent=2))
              if not {'video','audio'}.issubset({s.get('codec_type') for s in probe.get('streams',[])}):raise RuntimeError('required_AV_streams_missing')
              if float(probe['format']['duration'])>end-start+2 or m.stat().st_size>100*1024*1024:raise RuntimeError('range_or_size_limit')
              rc,frames,err=run(['ffprobe','-v','error','-show_frames','-show_entries','frame=media_type,pts,pts_time,best_effort_timestamp,best_effort_timestamp_time,pkt_dts_time,pkt_duration_time,nb_samples','-of','json',str(m)],40)
              if rc:raise RuntimeError('frame_timing_probe_failed')
              (d/'frame_audio_timing.json').write_text(frames)
              rc,a,b=run(['ffmpeg','-nostdin','-v','error','-i',str(m),'-map','0:a:0','-vn','-c:a','pcm_s16le',str(d/'audio.wav')],30)
              if rc:raise RuntimeError('audio_decode_failed')
              rec.update(status='MEDIA_AUDIO_VIDEO_INGESTED',segment_file=m.name,audio_file='audio.wav',audio_perceptually_evaluated=False,causal_boundaries='UNASSIGNED',source_start_seconds=start,source_end_seconds=end,transform='bounded yt-dlp section force-keyframe reencode; same output mux retains common AV stream timing; PCM16 decode no gain/denoise/timewarp',source_absolute_mapping='requested start offset; frame-exact original mapping must be checked against output PTS and seek behavior, not assumed',hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in [m,d/'audio.wav']})
            except Exception as e:
              rec['error']=safe_error(str(e))
              for p in d.glob('segment.*'):p.unlink(missing_ok=True)
              (d/'audio.wav').unlink(missing_ok=True)
            (d/'receipt.json').write_text(json.dumps(rec,indent=2));results.append(rec);print(src['source_id'],rec['status'],rec.get('error',''))
          (out/'results.json').write_text(json.dumps(results,indent=2));(out/'sha256.json').write_text(json.dumps({str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()},indent=2))
          PY
      - name: Publish temporary sensor artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ace-s05f-sensor-r001-${{ github.run_id }}
          path: ${{ runner.temp }}/ace-s05f/out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
