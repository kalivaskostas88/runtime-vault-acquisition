name: ACE S08 targeted official expression source search
on:
  push:
    branches: [research/ace-s05e-20260922]
    paths: ['.github/workflows/ace_s05e_ingest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Search verified official ACE_Studio archive only
        env:
          OUT: ${{ runner.temp }}/ace-s08
        run: |
          mkdir -p "$OUT"
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,os,pathlib,hashlib,datetime,time
          out=pathlib.Path(os.environ['OUT']); mid='290069256'
          keywords=['情感','温柔','激烈','呼吸','假声','张力','能量','参数']
          records=[]
          def get(url,cap=1024*1024):
            req=urllib.request.Request(url,headers={'User-Agent':'ACE-public-media-research/1.0'})
            with urllib.request.urlopen(req,timeout=20) as f:b=f.read(cap+1)
            if len(b)>cap: raise RuntimeError('size_limit')
            return b,json.loads(b)
          for kw in keywords:
            u='https://api.bilibili.com/x/space/arc/search?'+urllib.parse.urlencode({'mid':mid,'ps':10,'pn':1,'keyword':kw,'order':'pubdate'})
            r={'keyword':kw,'url':u}
            try:
              raw,j=get(u); r.update(api_code=j.get('code'),api_message=j.get('message'),sha256=hashlib.sha256(raw).hexdigest())
              if j.get('code')==0:
                items=((j.get('data') or {}).get('list') or {}).get('vlist') or []
                r.update(status='PUBLIC_OFFICIAL_SEARCH_READ',candidates=[{k:x.get(k) for k in ['bvid','title','created','length','description','author','mid']} for x in items[:10]])
              else:r['status']='PUBLIC_LOOKUP_UNAVAILABLE_NO_BYPASS'
            except Exception as e:r.update(status='PUBLIC_LOOKUP_UNAVAILABLE_NO_BYPASS',error=str(e))
            records.append(r); print(kw,r['status'],len(r.get('candidates',[]))); time.sleep(.4)
          # exact current priority demo identity check only
          yurl='https://www.youtube.com/watch?v=vTPYKyeKMTc'; oe='https://www.youtube.com/oembed?'+urllib.parse.urlencode({'url':yurl,'format':'json'})
          y={'source_url':yurl,'role':'current official priority expression demo'}
          try:
            raw,j=get(oe); y.update(status='OEMBED_READ',sha256=hashlib.sha256(raw).hexdigest(),identity={k:j.get(k) for k in ['title','author_name','author_url','provider_name']})
          except Exception as e:y.update(status='OEMBED_UNAVAILABLE',error=str(e))
          result={'run_id':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA'),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'official ACE_Studio expression/breath source selection only','official_mid':mid,'records':records,'youtube_priority':y}
          (out/'official_expression_search.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: One-day search receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ace-s08-expression-search-${{ github.run_id }}
          path: ${{ runner.temp }}/ace-s08/
          retention-days: 1
          if-no-files-found: warn
