name: ACE S05E targeted public media references
on:
  push:
    branches: [research/ace-s05e-20260922]
    paths: ['.github/workflows/ace_s05e_target_assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect identified public singing-page chunk and publisher context
        env:
          OUT: ${{ runner.temp }}/ace-target-assets
        run: |
          mkdir -p "$OUT"
          python3 - <<'PY'
          import os,pathlib,json,urllib.request,hashlib,datetime
          p=pathlib.Path(os.environ['OUT']);results=[]
          targets=[('singing_page.js','https://acestudio.ai/static/js/index.9c8b19f2-1790059030873.js'),('audio_preview.js','https://acestudio.ai/static/js/PreviewAudio.2cf5ab7f-1790059030873.js'),('publisher_context.html','https://www.soundonsound.com/reviews/ace-studio-audio-examples')]
          for name,url in targets:
            r={'source_url':url,'role':'navigation_or_publisher_context_not_audio_evidence'}
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ACE-public-media-research/1.0'}),timeout=20) as f:
                b=f.read(2*1024*1024+1);r.update(http_status=f.status,final_url=f.url)
              if len(b)>2*1024*1024:raise RuntimeError('bounded_size_limit')
              (p/name).write_bytes(b);r.update(file=name,bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),status='PUBLIC_ASSET_READ')
            except Exception as e:r.update(status='SOURCE_INGEST_FAILED',error=str(e))
            results.append(r)
          (p/'receipt.json').write_text(json.dumps({'run_id':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA'),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'targets':results},indent=2))
          PY
      - name: Temporary navigation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ace-s05e-target-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/ace-target-assets/
          retention-days: 1
          if-no-files-found: warn
