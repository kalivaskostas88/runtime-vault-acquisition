name: ACE S05F prior candidate source binding
on:
  push:
    branches: [research/ace-s05e-20260922]
    paths: ['.github/workflows/ace_s05f_source_binding.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read only original-media references from the known navigation page
        env:
          OUT: ${{ runner.temp }}/ace-s05f-source
        run: |
          mkdir -p "$OUT"
          python3 - <<'PY'
          import urllib.request,re,json,os,pathlib,hashlib,html,datetime
          u='https://lilys.ai/ko/notes/755229';r={'navigation_source':u,'purpose':'recover original media identity only; not transcript evidence','requested_window':[440,505],'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA')}
          try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'ACE-public-media-research/1.0'}),timeout=25) as f:
              b=f.read(3*1024*1024+1);r.update(http_status=f.status,final_url=f.url)
            if len(b)>3*1024*1024:raise RuntimeError('navigation_size_limit')
            t=html.unescape(b.decode('utf8','replace')).replace('\\/','/').replace('\\u0026','&');r['page_sha256']=hashlib.sha256(b).hexdigest()
            patterns=[r'(?:youtube\.com/(?:watch\?v=|embed/)|youtu\.be/|(?:i\.)?ytimg\.com/(?:vi|vi_webp)/)([A-Za-z0-9_-]{11})',r'(?:videoId|youtubeId|video_id|youtube_id)[\\"\s:]+([A-Za-z0-9_-]{11})']
            hits=[]
            for pat in patterns:
              for m in re.finditer(pat,t):hits.append({'video_id':m.group(1),'context':t[max(0,m.start()-140):m.end()+160]})
            r['media_identity_candidates']=hits[:25];r['unique_video_ids']=sorted(set(h['video_id'] for h in hits));r['status']='NAVIGATION_REFERENCES_READ'
          except Exception as e:r.update(status='NAVIGATION_BINDING_FAILED',error=str(e))
          pathlib.Path(os.environ['OUT'],'source_binding.json').write_text(json.dumps(r,ensure_ascii=False,indent=2));print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: One-day navigation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ace-s05f-source-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/ace-s05f-source/
          retention-days: 1
          if-no-files-found: warn
