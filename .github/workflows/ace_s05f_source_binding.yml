name: ACE S05F2 official counterpart lookup
on:
  push:
    branches: [research/ace-s05e-20260922]
    paths: ['.github/workflows/ace_s05f_source_binding.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: One keyword in the already verified official publisher only
        env:
          OUT: ${{ runner.temp }}/ace-s05f2-counterpart
        run: |
          mkdir -p "$OUT"
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,os,datetime,hashlib
          u='https://api.bilibili.com/x/space/arc/search?'+urllib.parse.urlencode({'mid':290069256,'ps':5,'pn':1,'keyword':'温柔','order':'pubdate'})
          r={'purpose':'exact gentle-demo counterpart in official ACE_Studio catalog only; no broad catalog download','url':u,'run_id':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA'),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'ACE-public-media-research/1.0'}),timeout=20) as f:b=f.read(512*1024+1);r['http_status']=f.status
            if len(b)>512*1024:raise RuntimeError('response_size_limit')
            j=json.loads(b);r.update(api_code=j.get('code'),api_message=j.get('message'),sha256=hashlib.sha256(b).hexdigest())
            if j.get('code')!=0:r['status']='PUBLIC_LOOKUP_UNAVAILABLE_NO_BYPASS'
            else:
              d=j.get('data') or {};r.update(status='PUBLIC_LOOKUP_READ',page=d.get('page'),candidates=[{k:v.get(k) for k in ['bvid','title','author','mid','created','length','description']} for v in (d.get('list') or {}).get('vlist',[])[:5]])
          except Exception as e:r.update(status='PUBLIC_LOOKUP_UNAVAILABLE_NO_BYPASS',error=str(e))
          pathlib.Path(os.environ['OUT'],'counterpart_lookup.json').write_text(json.dumps(r,ensure_ascii=False,indent=2));print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: One-day receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ace-s05f2-counterpart-${{ github.run_id }}
          path: ${{ runner.temp }}/ace-s05f2-counterpart/
          retention-days: 1
          if-no-files-found: warn
