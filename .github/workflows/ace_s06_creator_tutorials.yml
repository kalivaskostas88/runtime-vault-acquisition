name: ACE S06 creator-first short tutorial ingest
on:
  push:
    branches: [research/ace-s05e-20260922]
    paths: ['.github/workflows/ace_s06_creator_tutorials.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare bounded media toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ace-s06/out"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Acquire exact short public tutorial sources
        env:
          ROOT: ${{ runner.temp }}/ace-s06
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, os, pathlib, hashlib, datetime, subprocess, signal, resource, socket, ipaddress, re
          root=pathlib.Path(os.environ['ROOT']); out=root/'out'; out.mkdir(exist_ok=True)
          known={
            'GLIDE':('BV1D94y1Q7Dm','ACE Studio快速入门教程第4期：音高参数-滑音'),
            'SPECIAL':('BV1Hd4y1T7Vb','ACE Studio快速入门教程第6期：音高参数-特殊技巧'),
            'SPLIT_SYLLABLE':('BV1Y14y1b7Zq','ACE Studio快速入门教程第7期：拆音'),
            'PARAM_PANEL':('BV11P411378h','ACE Studio快速入门教程第8期：参数面板'),
          }
          wanted_titles={
            'CONSONANT':'ACE Studio快速入门教程第3期：辅音长度参数',
            'VIBRATO':'ACE Studio快速入门教程第5期：音高参数-颤音',
          }
          def get_json(url,cap=2*1024*1024):
            req=urllib.request.Request(url,headers={'User-Agent':'ACE-public-media-research/1.0'})
            with urllib.request.urlopen(req,timeout=20) as f:
              b=f.read(cap+1)
            if len(b)>cap: raise RuntimeError('metadata_size_limit')
            j=json.loads(b)
            if j.get('code') not in [None,0]: raise RuntimeError('api_denied:'+str(j.get('code'))+':'+str(j.get('message')))
            return j.get('data',j), hashlib.sha256(b).hexdigest()
          # Resolve exact two missing series items only from related list of a known series item.
          try:
            rel,_=get_json('https://api.bilibili.com/x/web-interface/archive/related?bvid=BV11P411378h')
            for item in rel or []:
              title=item.get('title')
              for sid,wtitle in list(wanted_titles.items()):
                if title==wtitle:
                  known[sid]=(item.get('bvid'),title)
          except Exception:
            pass
          manifest={'run':'ACE_S06_CREATOR_TUTORIALS_R001','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sources':[],'evidence_boundary':'legacy affiliated tutorial media for production-useful learning; not current-build calibration'}
          def limits(): resource.setrlimit(resource.RLIMIT_FSIZE,(128*1024*1024,128*1024*1024))
          def run(args,timeout):
            p=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,start_new_session=True,preexec_fn=limits)
            try: s,e=p.communicate(timeout=timeout); return p.returncode,s,e
            except subprocess.TimeoutExpired:
              os.killpg(p.pid,signal.SIGKILL); s,e=p.communicate(); return 124,s,e+'\nTIME_LIMIT'
          def clean(s): return re.sub(r'https?://[^\s\"\']+','[MEDIA_URL_REDACTED]',s)[-5000:]
          def ffprobe(path,name):
            rc,s,e=run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(path)],20)
            if rc: raise RuntimeError('ffprobe_failed:'+clean(e))
            j=json.loads(s); (path.parent/name).write_text(json.dumps(j,indent=2)); return j
          for sid,(bvid,expected_title) in known.items():
            rec={'source_id':sid,'bvid':bvid,'expected_title':expected_title,'status':'SOURCE_INGEST_FAILED'}
            d=out/sid; d.mkdir()
            try:
              data,mh=get_json('https://api.bilibili.com/x/web-interface/view?bvid='+bvid)
              if data.get('bvid')!=bvid or data.get('title')!=expected_title: raise RuntimeError('identity_mismatch')
              duration=float(data.get('duration') or 0)
              if not (0 < duration <= 360): raise RuntimeError('short_source_duration_limit')
              rights=data.get('rights') or {}
              if rights.get('pay'): raise RuntimeError('paid_source_not_admitted')
              cid=data.get('cid')
              rec.update(title=data.get('title'),cid=cid,duration=duration,pubdate=data.get('pubdate'),owner=data.get('owner'),metadata_sha256=mh,rights=rights)
              player,ph=get_json('https://api.bilibili.com/x/player/playurl?'+urllib.parse.urlencode({'bvid':bvid,'cid':cid,'qn':32,'fnval':16,'fourk':0}))
              if player.get('is_preview'): raise RuntimeError('preview_not_admitted')
              dash=player.get('dash') or {}
              vs=[s for s in dash.get('video',[]) if s.get('height',9999)<=480 and str(s.get('codecs','')).startswith('avc')]
              ads=[s for s in dash.get('audio',[]) if s.get('codecs')=='mp4a.40.2']
              if not vs or not ads: raise RuntimeError('public_AV_representations_missing')
              v=max(vs,key=lambda s:s.get('height',0)); a=max(ads,key=lambda s:s.get('bandwidth',0))
              urls=[]; selected=[]
              for s in [v,a]:
                u=urllib.parse.urljoin('https://www.bilibili.com/video/'+bvid+'/',s.get('baseUrl') or s.get('base_url'))
                parts=urllib.parse.urlsplit(u)
                if parts.scheme not in ['https','http'] or not parts.hostname or parts.username or parts.password: raise RuntimeError('invalid_public_media_url')
                addresses={x[4][0] for x in socket.getaddrinfo(parts.hostname,parts.port or (443 if parts.scheme=='https' else 80))}
                if not addresses or any(not ipaddress.ip_address(x).is_global for x in addresses): raise RuntimeError('nonpublic_destination_rejected')
                urls.append(u); selected.append({k:s.get(k) for k in ['id','codecs','mimeType','width','height','bandwidth','frameRate','SegmentBase']})
              headers=['-user_agent','ACE-public-media-research/1.0','-headers','Referer: https://www.bilibili.com/\r\n','-rw_timeout','20000000']
              args=['ffmpeg','-nostdin','-v','warning','-copyts']+headers+['-i',urls[0]]+headers+['-i',urls[1],'-map','0:v:0','-map','1:a:0','-c','copy','-copytb','1','-avoid_negative_ts','disabled','-to',str(duration+0.5),str(d/'source.mkv')]
              rc,s,e=run(args,180); (d/'remux.log').write_text(clean(e))
              if rc: raise RuntimeError('remux_failed:'+str(rc))
              pr=ffprobe(d/'source.mkv','ffprobe.json')
              if not {'video','audio'}.issubset({x.get('codec_type') for x in pr.get('streams',[])}): raise RuntimeError('missing_AV')
              rc,s,e=run(['ffmpeg','-nostdin','-v','error','-i',str(d/'source.mkv'),'-map','0:a:0','-vn','-c:a','pcm_s16le',str(d/'audio.wav')],45)
              if rc: raise RuntimeError('audio_decode_failed')
              # Lightweight orientation frames every ~10 s; no dense dump.
              frames=d/'orientation'; frames.mkdir()
              rc,s,e=run(['ffmpeg','-nostdin','-v','error','-i',str(d/'source.mkv'),'-vf','fps=1/10','-q:v','3',str(frames/'f_%03d.jpg')],60)
              if rc: raise RuntimeError('orientation_frames_failed')
              rec.update(status='SAME_SOURCE_AV_INGESTED',player_response_sha256=ph,selected_streams=selected,transform='full short source stream-copy remux preserving source timing; PCM16 decode; orientation only 1 frame/10s',hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in [d/'source.mkv',d/'audio.wav']})
            except Exception as ex:
              rec['error']=clean(str(ex))
              for p in [d/'source.mkv',d/'audio.wav']: p.unlink(missing_ok=True)
            (d/'receipt.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)); manifest['sources'].append(rec); print(sid,rec['status'],rec.get('error',''))
          manifest['resolved_missing_ids']={k:v[0] for k,v in known.items() if k in wanted_titles}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          (out/'sha256.json').write_text(json.dumps({str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()},indent=2))
          PY
      - name: Temporary creator-tutorial transport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ace-s06-creator-tutorials-${{ github.run_id }}
          path: ${{ runner.temp }}/ace-s06/out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
