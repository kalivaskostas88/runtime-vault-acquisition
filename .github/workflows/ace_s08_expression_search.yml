name: ACE S08 targeted official expression source search
on:
  push:
    branches: [research/ace-s05e-20260922]
    paths: ['.github/workflows/ace_s08_expression_search.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Search only verified official ACE_Studio archive for expression gaps
        env:
          OUT: ${{ runner.temp }}/ace-s08-search
        run: |
          mkdir -p "$OUT"
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, os, pathlib, hashlib, datetime, time
          out=pathlib.Path(os.environ['OUT']); mid='290069256'
          keywords=['情感','温柔','激烈','呼吸','假声','张力','能量','参数']
          records=[]
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'ACE-public-media-research/1.0'})
            with urllib.request.urlopen(req,timeout=20) as f:b=f.read(1024*1024+1)
            if len(b)>1024*1024:raise RuntimeError('size_limit')
            return b,json.loads(b)
          for kw in keywords:
            q='https://api.bilibili.com/x/space/arc/search?'+urllib.parse.urlencode({'mid':mid,'ps':10,'pn':1,'keyword':kw,'order':'pubdate'})
            rec={'keyword':kw,'url':q}
            try:
              raw,j=get(q);rec.update(http_status=200,sha256=hashlib.sha256(raw).hexdigest(),api_code=j.get('code'),api_message=j.get('message'))
              if j.get('code')==0:
                items=((j.get('data') or {}).get('list') or {}).get('vlist') or []
                rec['candidates']=[{k:x.get(k) for k in ['bvid','title','created','length','description','author','mid']} for x in items[:10]]
                rec['status']='PUBLIC_OFFICIAL_SEARCH_READ'
              else: rec['status']='PUBLIC_LOOKUP_UNAVAILABLE_NO_BYPASS'
            except Exception as e:
              rec.update(status='PUBLIC_LOOKUP_UNAVAILABLE_NO_BYPASS',error=str(e))
            records.append(rec); print(kw,rec['status'],len(rec.get('candidates',[]))); time.sleep(.5)
          # exact current priority YouTube identity only; no media bypass
          yurl='https://www.youtube.com/watch?v=vTPYKyeKMTc'
          oe='https://www.youtube.com/oembed?'+urllib.parse.urlencode({'url':yurl,'format':'json'})
          y={'source_url':yurl,'role':'current official priority demo identity only'}
          try:
            raw,j=get(oe);y.update(status='OEMBED_READ',sha256=hashlib.sha256(raw).hexdigest(),identity={k:j.get(k) for k in ['title','author_name','author_url','provider_name']})
          except Exception as e:y.update(status='OEMBED_UNAVAILABLE',error=str(e))
          result={'run_id':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA'),'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'official_mid':mid,'scope':'targeted official expression/breath source selection only; no broad discovery','records':records,'youtube_priority':y}
          (out/'official_expression_search.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: One-day search receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ace-s08-expression-search-${{ github.run_id }}
          path: ${{ runner.temp }}/ace-s08-search/
          retention-days: 1
          if-no-files-found: warn
