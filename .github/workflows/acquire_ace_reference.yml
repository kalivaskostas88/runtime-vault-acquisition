name: Acquire ACE Celestia reference

on:
  push:
    paths:
      - '.github/workflows/acquire_ace_reference.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and download public Audio.com reference
        shell: python
        run: |
          import json, re, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          page = 'https://audio.com/schnickltoven/audio/can-you-understand-me'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': 'application/json,text/html;q=0.9,*/*;q=0.8',
              'Referer': 'https://audio.com/',
          }

          def get(url, accept=None):
              h = dict(headers)
              if accept:
                  h['Accept'] = accept
              req = urllib.request.Request(url, headers=h)
              return urllib.request.urlopen(req, timeout=60)

          audio_id = None
          oembed = 'https://api.audio.com/oembed?url=' + urllib.parse.quote(page, safe='') + '&format=json'
          try:
              with get(oembed, 'application/json') as r:
                  payload = json.load(r)
              html = payload.get('html', '') if isinstance(payload, dict) else ''
              m = re.search(r'audio\.com/(?:embed/)?audio/([0-9]{6,24})', html)
              if m:
                  audio_id = m.group(1)
          except Exception as e:
              print('oembed failed:', repr(e))

          if not audio_id:
              with get(page, 'text/html') as r:
                  page_html = r.read().decode('utf-8', 'ignore')
              patterns = [
                  r'audio\.com/embed/audio/([0-9]{6,24})',
                  r'"audioId"\s*:\s*"?([0-9]{6,24})"?',
                  r'"audio_id"\s*:\s*"?([0-9]{6,24})"?',
                  r'/audio/([0-9]{6,24})',
              ]
              for pat in patterns:
                  m = re.search(pat, page_html)
                  if m:
                      audio_id = m.group(1)
                      break
              print('page bytes:', len(page_html), 'resolved id:', audio_id)

          if not audio_id:
              raise RuntimeError('Could not resolve Audio.com audio id')

          with get(f'https://api.audio.com/audio/{audio_id}', 'application/json') as r:
              meta = json.load(r)

          candidates = []
          for key in ('transcodings', 'sources'):
              value = meta.get(key) if isinstance(meta, dict) else None
              if isinstance(value, list):
                  for item in value:
                      if isinstance(item, dict) and isinstance(item.get('url'), str):
                          candidates.append(item)

          if not candidates:
              raise RuntimeError('No playable URLs returned by Audio.com')

          chosen = next((x for x in candidates if x.get('format') == 'mp3' or x.get('type') == 'audio/mpeg'), candidates[0])
          stream_url = chosen['url']
          suffix = '.mp3' if (chosen.get('format') == 'mp3' or chosen.get('type') == 'audio/mpeg') else '.audio'
          out = Path('ace_celestia_multivoice_reference' + suffix)

          with get(stream_url, '*/*') as r, out.open('wb') as f:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk:
                      break
                  f.write(chunk)

          Path('ace_reference_metadata.json').write_text(json.dumps({
              'source_page': page,
              'audio_id': audio_id,
              'title': meta.get('title') if isinstance(meta, dict) else None,
              'chosen': {k: chosen.get(k) for k in ('format','type')},
              'bytes': out.stat().st_size,
              'file': out.name,
          }, indent=2), encoding='utf-8')
          print(out.name, out.stat().st_size)

      - name: Commit acquired reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ace_celestia_multivoice_reference.* ace_reference_metadata.json
          git commit -m "Add temporary ACE Celestia reference audio" || exit 0
          git push
