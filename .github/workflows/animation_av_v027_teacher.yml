name: ANIMATION V027 — educational video extraction (isolated, read-only)
on:
  push:
    branches:
      - research/animation-av-v027-20261117
    paths:
      - research/animation_v027/run-request.json
permissions:
  contents: read
jobs:
  capture-public-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout research-only branch
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install A/V study dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet 'yt-dlp[default]' Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
      - name: Analyze public lesson without archiving full source
        run: python research/animation_v027/collect_public_video.py
      - name: Keep bounded learning evidence even on failed access
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-v027-teacher-window-evidence
          path: research/animation_v027/evidence/
          retention-days: 7
          if-no-files-found: warn
