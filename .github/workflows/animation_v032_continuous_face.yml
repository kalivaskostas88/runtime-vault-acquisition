name: V032 native Blender 5.2.2 unified facial mesh proof
on:
  push:
    branches:
      - research/animation-v032-welded-face-20261117
    paths:
      - research/animation_v032/run-request.json
permissions:
  contents: write
jobs:
  original-orbital-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - name: Acquire official Blender 5.2.2 and verify vendor manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 460 --silent --show-error \
            -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 120 --silent --show-error \
            -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xJf blender-5.2.2-linux-x64.tar.xz
          echo "BLENDER_BIN=$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Install Blender Linux graphics runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libegl-mesa0 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libx11-6 libxext6 xvfb
          ldconfig -p | grep libEGL.so.1
      - name: Validate original unified facial mesh static topology\n        run: python research/animation_v032/test_geometry_v032.py\n      - name: Build, native render, measured 3D raycast occlusion
        shell: bash
        env:
          ANIMATION_V032_OUT: ${{ github.workspace }}/research/animation_v032/native_output
        run: |
          set -euo pipefail
          xvfb-run -a "$BLENDER_BIN" --background --factory-startup --python-exit-code 33 --python research/animation_v032/build_blender_v032.py
          test -s "$ANIMATION_V032_OUT/RECEIPT.json"
          test -s "$ANIMATION_V032_OUT/native_integrated_facial_mask_v032.blend"
      - name: Verify by fresh native Blender reopen
        shell: bash
        env:
          ANIMATION_V032_OUT: ${{ github.workspace }}/research/animation_v032/native_output
        run: |
          set -euo pipefail
          xvfb-run -a "$BLENDER_BIN" --background "$ANIMATION_V032_OUT/native_integrated_facial_mask_v032.blend" \
            --python-exit-code 34 --python research/animation_v032/verify_saved_v032.py
          test -s "$ANIMATION_V032_OUT/FRESH_READBACK.json"
          cd "$ANIMATION_V032_OUT"
          sha256sum native_integrated_facial_mask_v032.blend preview_*.png RECEIPT.json FRESH_READBACK.json > SHA256SUMS.txt
      - name: Persist only original bounded outputs in isolated research branch (artifact quota independent)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s research/animation_v032/native_output/RECEIPT.json
          test -s research/animation_v032/native_output/FRESH_READBACK.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/animation_v032/native_output/
          git diff --cached --quiet && exit 0
          git commit -m 'Record V032 native Blender unified facial mesh proof with bounded caveats'
          git push origin HEAD:research/animation-v032-welded-face-20261117
