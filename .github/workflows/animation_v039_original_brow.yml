name: V039B reclassification of mask gradient real original brow native sculpt
on:
  push:
    branches:
      - research/animation-v039-original-brow-20261117
    paths:
      - research/animation_v039/run-v039b-request.json
permissions:
  contents: write
jobs:
  original-brow-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Acquire exact vendor Blender 5.2.2 with SHA verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"; cd "$RUNNER_TEMP/blender522"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 460 -sS -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 120 -sS -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xJf blender-5.2.2-linux-x64.tar.xz
          echo "BLENDER_BIN=$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Install virtual GUI for Sculpt essential brush
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libegl-mesa0 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libx11-6 libxext6 xvfb
      - name: Pure geometry and negative unit preflight
        run: python research/animation_v039/test_geometry_v039.py
      - name: Native V039 isolated broad brow build / brush proof
        shell: bash
        run: |
          set -euo pipefail
          timeout 190 xvfb-run -a "$BLENDER_BIN" --factory-startup --python-exit-code 33 --python research/animation_v039/run_v039b_native_brow.py
          python - <<'PY'
          import json
          d=json.load(open('research/animation_v039/native_v039b/RECEIPT.json'))
          print('V039B_NATIVE_STATUS:',d['native_status'])
          assert d['native_status']=='PASS_NARROW_BROW_SCULPT',d
          assert d['GS001']=='UNTOUCHED' and d['art_status']=='HOLD'
          PY
      - name: Preserve native outputs and failing receipts independently
        if: always()
        run: |
          set -euo pipefail
          if [ -f research/animation_v039/native_v039b/RECEIPT.json ]; then
             git config user.name 'github-actions[bot]'
             git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
             git add research/animation_v039/native_v039b
             git diff --cached --quiet && exit 0
             git commit -m 'Record V039 isolated real Blender broad brow and negative receipts'
             git push origin HEAD:research/animation-v039-original-brow-20261117
          fi
