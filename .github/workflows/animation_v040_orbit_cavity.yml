name: V040 verified original negative-volume orbital cavity in Blender 5.2.2
on:
  push:
    branches:
      - research/animation-v040-orbit-cavity-20261117
    paths:
      - research/animation_v040/run-v040-request.json
permissions:
  contents: write
jobs:
  native-orbit-cavity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Vendor Blender 5.2.2 checksum and download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"; cd "$RUNNER_TEMP/blender522"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 440 -sS -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 120 -sS -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xJf blender-5.2.2-linux-x64.tar.xz
          echo "BLENDER_BIN=$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Install software GL and Xvfb for actual previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libegl-mesa0 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libx11-6 libxext6 xvfb
      - name: Execute isolated original native exact Boolean + physical depth QA
        shell: bash
        run: |
          set -euo pipefail
          timeout 160 xvfb-run -a "$BLENDER_BIN" --background --factory-startup --python-exit-code 36 --python research/animation_v040/orbital_cavity_v040.py
          python - <<'PY'
          import json
          d=json.load(open('research/animation_v040/native_v040/RECEIPT.json'))
          print('V040_NATIVE_STATUS',d['native'])
          assert d['native']=='NATIVE_BOOLEAN_CAVITY_SCOPE_PASS'
          assert d['GS001']=='UNTOUCHED' and d['art']=='HOLD'
          assert len(d['before'])==len(d['after'])==4
          PY
      - name: Commit original proof or failure witnesses
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f research/animation_v040/native_v040/RECEIPT.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/animation_v040/native_v040
            if ! git diff --cached --quiet; then
              git commit -m 'Preserve V040 native real orbital cavity raycast and image evidence'
              git push origin HEAD:research/animation-v040-orbit-cavity-20261117
            fi
          fi