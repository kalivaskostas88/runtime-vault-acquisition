name: V043 Dense real expert full source AV action windows
on:
  push:
    branches:
      - research/animation-v043-kaspar-full-video-20261117
    paths:
      - research/animation_v043/dense-run.json
permissions:
  contents: write
jobs:
  inspect-critical-eye-and-brow-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install static bundled free FFmpeg and image codecs
        run: python -m pip install --quiet requests pillow imageio-ffmpeg
      - name: Verify original source hash and extract seven dense original AV windows
        run: python research/animation_v043/dense_original_av_v043.py
      - name: Commit real visual timeline evidence or scoped failure receipt
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f research/animation_v043/DENSE_RECEIPT.json ]; then
            git add research/animation_v043/DENSE_RECEIPT.json
          fi
          if [ -d research/animation_v043/dense_contacts ]; then
            git add research/animation_v043/dense_contacts
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'V043 real source dense visual study evidence and independent original SHA'
            git push origin HEAD:research/animation-v043-kaspar-full-video-20261117
          fi
