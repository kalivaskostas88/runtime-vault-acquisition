name: V043 Probe publicly free CC-BY Kaspar instructional source
on:
  push:
    branches: [research/animation-v043-kaspar-full-video-20261117]
    paths:
      - .github/workflows/animation_v043_video_probe.yml
permissions:
  contents: write
jobs:
  inspect-original-free-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe actual public download links without authentication bypass
        run: python research/animation_v043/probe_source.py
      - name: Save machine-observed links
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/animation_v043/probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'V043 preserve actual free source link probe'
            git push origin HEAD:research/animation-v043-kaspar-full-video-20261117
          fi
