name: V045 original native globe/lid conformance proof in Blender
on:
  push:
    branches:
      - research/animation-v045-globe-lid-conformance-20261117
    paths:
      - research/animation_v045/run-v045-request.json
permissions:
  contents: write
jobs:
  original-globe-lid-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Blender 5.2.2 release and verify official checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"; cd "$RUNNER_TEMP/blender522"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 440 -sS -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 120 -sS -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xJf blender-5.2.2-linux-x64.tar.xz
          echo "BLENDER_BIN=$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Prepare isolated CPU rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libegl-mesa0 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libx11-6 libxext6 xvfb
      - name: Execute real original Blender geometry and negative tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 xvfb-run -a "$BLENDER_BIN" --background --factory-startup --python-exit-code 47 --python research/animation_v045/globe_lid_real_native_v045.py
          python - <<'PY'
          import json
          r=json.load(open('research/animation_v045/native_v045/RECEIPT.json'))
          assert r['native']=='NATIVE_GLOBE_LID_MARGIN_PROXIMITY_PASS',r
          assert len(r["negative_controls"])==3 and all(x["rejected"] for x in r["negative_controls"].values())
          assert len(r["images"])==4
          assert r["art"]=="HOLD" and r["protection"]=="GS001_UNTOUCHED"
          print("NATIVE_V045_GATE_PASS",r["geometry"]["margin_samples"])
          PY
      - name: Reopen saved model in a NEW Blender process and verify actual geometry and PNG SHA
        shell: bash
        run: |
          set -euo pipefail
          timeout 130 xvfb-run -a "$BLENDER_BIN" --background --factory-startup research/animation_v045/native_v045/V045_GLOBE_LID_ORIGINAL_TEST_FIXTURE.blend --python-exit-code 48 --python research/animation_v045/fresh_reopen_v045.py
          python - <<'PY'
          import json
          r=json.load(open('research/animation_v045/native_v045/FRESH_READBACK.json'))
          assert r['status']=='FRESH_SAVED_NATIVE_RELOAD_PASS'
          assert len(r["verified_original_images"])==4
          PY
      - name: Preserve REAL proof or failure witnesses without changing protected assets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d research/animation_v045/native_v045 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/animation_v045/native_v045
            if ! git diff --cached --quiet; then
              git commit -m 'V045 preserve real native globe lid margin and fresh-readback evidence'
              git push origin HEAD:research/animation-v045-globe-lid-conformance-20261117
            fi
          fi
