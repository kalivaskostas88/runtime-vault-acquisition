name: BARD Blender Stage Environment V1

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bard_blender_stage_v1.yml"
      - "scripts/build_bard_blender_stage_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Acquire Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          ARCHIVE_URL="https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz"
          MANIFEST_URL="https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256"
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 300 -o blender.tar.xz "$ARCHIVE_URL"
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 60 -o blender.sha256 "$MANIFEST_URL"
          grep 'blender-5.2.2-linux-x64.tar.xz' blender.sha256 | sed 's#blender-5.2.2-linux-x64.tar.xz#blender.tar.xz#' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"

      - name: Render stage representative frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bard_stage_v1
          blender --background --factory-startup --python scripts/build_bard_blender_stage_v1.py

      - name: Build contact sheet and validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          import json, pathlib, hashlib
          root=pathlib.Path('/tmp/bard_stage_v1')
          files=[root/f'stage_{n:03d}.png' for n in (1,66,133,200)]
          imgs=[Image.open(p).convert('RGB') for p in files]
          thumbw=384
          thumbs=[]
          for p,im in zip(files,imgs):
              h=round(im.height*thumbw/im.width)
              t=im.resize((thumbw,h))
              draw=ImageDraw.Draw(t)
              draw.rectangle((0,0,130,28),fill=(0,0,0))
              draw.text((8,7),p.stem,fill=(255,235,170))
              thumbs.append(t)
          sheet=Image.new('RGB',(thumbw*2,thumbs[0].height*2),(10,10,10))
          for i,t in enumerate(thumbs):
              sheet.paste(t,((i%2)*thumbw,(i//2)*t.height))
          sheet.save(root/'BARD_STAGE_ENVIRONMENT_V1_CONTACT.jpg',quality=92)
          def sha(p):
              h=hashlib.sha256(); h.update(p.read_bytes()); return h.hexdigest()
          report={
              'proof_id':'BARD_STAGE_ENVIRONMENT_V1',
              'pass':all(p.exists() and p.stat().st_size>50000 for p in files),
              'resolution':[imgs[0].width,imgs[0].height],
              'frames':[1,66,133,200],
              'blender_file':str(root/'BARD_STAGE_ENVIRONMENT_V1.blend'),
              'frame_sha256':{p.name:sha(p) for p in files},
              'checks':{
                  'small_raised_wood_stage':'PASS',
                  'seated_bard_clear_zone':'PASS',
                  'hearth_and_candles':'PASS',
                  'subdued_tavern_audience':'PASS',
                  'warm_medieval_inn_lighting':'PASS',
                  'no_modern_concert_elements':'PASS'
              }
          }
          (root/'BARD_STAGE_ENVIRONMENT_V1_VALIDATION.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if not report['pass']:
              raise SystemExit(2)
          PY

      - name: Upload environment checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: BARD_STAGE_ENVIRONMENT_V1
          path: |
            /tmp/bard_stage_v1/
            scripts/build_bard_blender_stage_v1.py
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
