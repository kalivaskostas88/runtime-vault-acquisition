name: BARD Blender Stage V2 Preview

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bard_blender_stage_v2_preview.yml"
      - "scripts/build_bard_blender_stage_v2_preview.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Acquire Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 300 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 60 -o blender.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender.sha256 | sed 's#blender-5.2.2-linux-x64.tar.xz#blender.tar.xz#' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"

      - name: Install headless graphics libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1 libxxf86vm1

      - name: Render V2 camera/layout candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bard_stage_v2_preview
          blender --background --factory-startup --python scripts/build_bard_blender_stage_v2_preview.py
          test -s /tmp/bard_stage_v2_preview/A_MASTER.png
          test -s /tmp/bard_stage_v2_preview/B_LEFT.png
          test -s /tmp/bard_stage_v2_preview/C_WIDE.png
          test -s /tmp/bard_stage_v2_preview/BARD_STAGE_V2_PREVIEW.blend

      - name: Build contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageDraw
          import pathlib,json
          root=pathlib.Path('/tmp/bard_stage_v2_preview')
          names=['A_MASTER','B_LEFT','C_WIDE']
          imgs=[Image.open(root/f'{n}.png').convert('RGB') for n in names]
          w=320
          thumbs=[]
          for n,im in zip(names,imgs):
              h=round(im.height*w/im.width);t=im.resize((w,h))
              d=ImageDraw.Draw(t);d.rectangle((0,0,w,30),fill=(0,0,0));d.text((8,8),n,fill=(255,232,180))
              thumbs.append(t)
          sheet=Image.new('RGB',(w*3,thumbs[0].height),(8,8,8))
          for i,t in enumerate(thumbs):sheet.paste(t,(i*w,0))
          sheet.save(root/'BARD_STAGE_V2_CAMERA_CONTACT.jpg',quality=92)
          rep={'proof_id':'BARD_STAGE_V2_PREVIEW','resolution':[imgs[0].width,imgs[0].height],'candidates':names,'pass':True}
          (root/'BARD_STAGE_V2_PREVIEW_VALIDATION.json').write_text(json.dumps(rep,indent=2))
          print(json.dumps(rep,indent=2))
          PY

      - name: Upload V2 preview
        uses: actions/upload-artifact@v4
        with:
          name: BARD_STAGE_V2_PREVIEW
          path: /tmp/bard_stage_v2_preview/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
