name: BARD Blender Stage V3 Master

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bard_blender_stage_v3_master.yml"
      - "scripts/build_bard_blender_stage_v3_master.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Acquire Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 300 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 60 -o blender.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender.sha256 | sed 's#blender-5.2.2-linux-x64.tar.xz#blender.tar.xz#' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"

      - name: Install headless graphics libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1 libxxf86vm1

      - name: Render V3 master stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bard_stage_v3_master
          blender --background --factory-startup --python scripts/build_bard_blender_stage_v3_master.py
          test -s /tmp/bard_stage_v3_master/BARD_STAGE_ENVIRONMENT_V3_MASTER.png
          test -s /tmp/bard_stage_v3_master/BARD_STAGE_ENVIRONMENT_V3_MASTER.blend

      - name: Validate master stage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          import pathlib,json,hashlib
          root=pathlib.Path('/tmp/bard_stage_v3_master')
          p=root/'BARD_STAGE_ENVIRONMENT_V3_MASTER.png'
          im=Image.open(p)
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          rep={
            'proof_id':'BARD_STAGE_ENVIRONMENT_V3_MASTER',
            'pass':p.stat().st_size>200000 and im.size==(768,1152),
            'resolution':list(im.size),
            'sha256':h,
            'production_intent':[
              'medieval inn raised wooden platform',
              'clear seated bard performance zone',
              'visible hearth',
              'warm candle/fire motivated lighting',
              'subdued foreground/background patrons',
              'no concert-stage language'
            ]
          }
          (root/'BARD_STAGE_ENVIRONMENT_V3_MASTER_VALIDATION.json').write_text(json.dumps(rep,indent=2))
          print(json.dumps(rep,indent=2))
          if not rep['pass']: raise SystemExit(2)
          PY

      - name: Upload V3 master
        uses: actions/upload-artifact@v4
        with:
          name: BARD_STAGE_ENVIRONMENT_V3_MASTER
          path: /tmp/bard_stage_v3_master/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
