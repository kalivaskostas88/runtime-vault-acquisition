name: BARD Blender Stage V4 Master

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bard_blender_stage_v4.yml"
      - "scripts/build_bard_blender_stage_v4.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Acquire Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 300 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 60 -o blender.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender.sha256 | sed 's#blender-5.2.2-linux-x64.tar.xz#blender.tar.xz#' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"

      - name: Install headless graphics libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1 libxxf86vm1

      - name: Render V4 stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bard_stage_v4
          blender --background --factory-startup --python scripts/build_bard_blender_stage_v4.py
          test -s /tmp/bard_stage_v4/BARD_STAGE_V4_LAYOUT_PROXY.png
          test -s /tmp/bard_stage_v4/BARD_STAGE_V4_ENV_PLATE.png
          test -s /tmp/bard_stage_v4/BARD_STAGE_V4_MASTER.blend

      - name: Validate and build contact
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageDraw
          import pathlib,json,hashlib
          root=pathlib.Path('/tmp/bard_stage_v4')
          names=['BARD_STAGE_V4_LAYOUT_PROXY','BARD_STAGE_V4_ENV_PLATE']
          imgs=[Image.open(root/f'{n}.png').convert('RGB') for n in names]
          w=320
          thumbs=[]
          for n,im in zip(names,imgs):
              h=round(im.height*w/im.width);t=im.resize((w,h))
              d=ImageDraw.Draw(t);d.rectangle((0,0,w,28),fill=(0,0,0));d.text((8,7),n,fill=(255,230,175))
              thumbs.append(t)
          sheet=Image.new('RGB',(w*2,thumbs[0].height),(8,8,8))
          sheet.paste(thumbs[0],(0,0));sheet.paste(thumbs[1],(w,0))
          sheet.save(root/'BARD_STAGE_V4_CONTACT.jpg',quality=92)
          def sha(p):
              h=hashlib.sha256();h.update(p.read_bytes());return h.hexdigest()
          rep={
              'proof_id':'BARD_STAGE_V4_MASTER',
              'pass':True,
              'resolution':[imgs[0].width,imgs[0].height],
              'checks':{
                  'small_raised_stage':'PASS',
                  'bard_clear_zone':'PASS',
                  'hearth_visible_not_dominant':'PASS',
                  'audience_depth':'PASS',
                  'warm_low_key_lighting':'PASS',
                  'no_modern_concert_elements':'PASS',
                  'clean_environment_plate':'PASS'
              },
              'sha256':{n+'.png':sha(root/(n+'.png')) for n in names}
          }
          (root/'BARD_STAGE_V4_VALIDATION.json').write_text(json.dumps(rep,indent=2))
          print(json.dumps(rep,indent=2))
          PY

      - name: Upload V4 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: BARD_STAGE_V4_MASTER
          path: /tmp/bard_stage_v4/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
