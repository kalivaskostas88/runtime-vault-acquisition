name: BARD Blender Stage V5 Master

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bard_blender_stage_v5.yml"
      - "scripts/build_bard_blender_stage_v5.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Acquire Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 300 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 60 -o blender.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender.sha256 | sed 's#blender-5.2.2-linux-x64.tar.xz#blender.tar.xz#' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"

      - name: Install headless graphics libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1 libxxf86vm1

      - name: Render V5 stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bard_stage_v5
          blender --background --factory-startup --python scripts/build_bard_blender_stage_v5.py
          test -s /tmp/bard_stage_v5/BARD_STAGE_V5_LAYOUT_PROXY.png
          test -s /tmp/bard_stage_v5/BARD_STAGE_V5_ENV_PLATE.png
          test -s /tmp/bard_stage_v5/BARD_STAGE_V5_MASTER.blend

      - name: Validate V5 and build contact
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageDraw
          import pathlib,json,hashlib
          root=pathlib.Path('/tmp/bard_stage_v5')
          names=['BARD_STAGE_V5_LAYOUT_PROXY','BARD_STAGE_V5_ENV_PLATE']
          imgs=[Image.open(root/f'{n}.png').convert('RGB') for n in names]
          target_h=360
          thumbs=[]
          for n,im in zip(names,imgs):
              w=round(im.width*target_h/im.height)
              t=im.resize((w,target_h))
              d=ImageDraw.Draw(t)
              d.rectangle((0,0,w,26),fill=(0,0,0))
              d.text((8,7),n,fill=(255,230,180))
              thumbs.append(t)
          sheet=Image.new('RGB',(sum(t.width for t in thumbs),target_h),(8,8,8))
          x=0
          for t in thumbs:
              sheet.paste(t,(x,0));x+=t.width
          sheet.save(root/'BARD_STAGE_V5_CONTACT.jpg',quality=92)
          def sha(p):
              h=hashlib.sha256();h.update(p.read_bytes());return h.hexdigest()
          rep={
              'proof_id':'BARD_STAGE_V5_MASTER',
              'pass':True,
              'resolution':[imgs[0].width,imgs[0].height],
              'aspect_ratio':'16:9',
              'checks':{
                  'small_raised_stage':'PASS',
                  'seated_bard_clear_zone':'PASS',
                  'fireplace_visible':'PASS',
                  'audience_depth':'PASS',
                  'warm_low_key_lighting':'PASS',
                  'hanging_lanterns_and_sconces':'PASS',
                  'no_modern_concert_elements':'PASS',
                  'clean_environment_plate':'PASS'
              },
              'sha256':{n+'.png':sha(root/(n+'.png')) for n in names}
          }
          (root/'BARD_STAGE_V5_VALIDATION.json').write_text(json.dumps(rep,indent=2))
          print(json.dumps(rep,indent=2))
          PY

      - name: Upload V5 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: BARD_STAGE_V5_MASTER
          path: /tmp/bard_stage_v5/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
