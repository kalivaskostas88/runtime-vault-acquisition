name: BARD MuseTalk 1.5 LipSync Proof 002

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bard_musetalk15_proof.yml"
      - "scripts/run_bard_musetalk15.py"
      - "assets/bard_ref_valid_384.jpg"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip gradio_client
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Prepare frozen 4s audio and real reference video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp outputs_musetalk
          AUDIO_URL="https://raw.githubusercontent.com/top-it-090304/Double_win/main/honor-of-aurora/audio/music/playlists/island_03/breves_dies_hominis_cc0_MagdalenKadel.ogg"
          LICENSE_URL="https://raw.githubusercontent.com/top-it-090304/Double_win/main/honor-of-aurora/audio/LICENSE_SOURCES.txt"
          curl --fail --location --silent --show-error --output tmp/full.ogg "$AUDIO_URL"
          curl --fail --location --silent --show-error --output tmp/LICENSE_SOURCES.txt "$LICENSE_URL"
          ffmpeg -hide_banner -loglevel error -y -ss 2 -t 4 -i tmp/full.ogg -ac 1 -ar 16000 tmp/bard_test_4s.wav
          ffmpeg -hide_banner -loglevel error -y -loop 1 -i assets/bard_ref_valid_384.jpg -t 4 -r 25 -c:v libx264 -pix_fmt yuv420p tmp/bard_ref_static_4s.mp4
          test -s tmp/bard_test_4s.wav
          test -s tmp/bard_ref_static_4s.mp4
          sha256sum assets/bard_ref_valid_384.jpg tmp/bard_ref_static_4s.mp4 tmp/bard_test_4s.wav > outputs_musetalk/INPUT_SHA256.txt

      - name: Generate MuseTalk 1.5 specialist face performance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_bard_musetalk15.py

      - name: Validate and create contact sheet
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json outputs_musetalk/BARD_LIPSYNC_PROOF_002_MUSETALK15.mp4 > outputs_musetalk/FFPROBE.json
          ffmpeg -hide_banner -loglevel error -y -i outputs_musetalk/BARD_LIPSYNC_PROOF_002_MUSETALK15.mp4 -vf "fps=2,scale=384:-1,tile=4x2" -frames:v 1 outputs_musetalk/CONTACT_SHEET.jpg

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BARD_LIPSYNC_PROOF_002_MUSETALK15
          path: |
            outputs_musetalk/
            tmp/bard_test_4s.wav
            tmp/bard_ref_static_4s.mp4
            tmp/LICENSE_SOURCES.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
