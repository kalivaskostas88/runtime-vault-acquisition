name: BARD Stage Mechanical Proxy V1

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bard_stage_mechanical_proxy_v1.yml"
      - "scripts/build_bard_stage_mechanical_proxy_v1.py"
      - "config/bard_studio_mechanical_v1_dope.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Acquire Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 300 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl --fail --location --silent --show-error --connect-timeout 30 --max-time 60 -o blender.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender.sha256 | sed 's#blender-5.2.2-linux-x64.tar.xz#blender.tar.xz#' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"

      - name: Install render and media dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1 libxxf86vm1 ffmpeg

      - name: Render 8s clay mechanical performance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bard_proxy_v1
          blender --background --factory-startup --python scripts/build_bard_stage_mechanical_proxy_v1.py
          test -s /tmp/bard_proxy_v1/BARD_STAGE_MECHANICAL_PROXY_V1.mp4
          test -s /tmp/bard_proxy_v1/BARD_STAGE_MECHANICAL_PROXY_V1.blend

      - name: Acquire frozen 8s CC0 vocal and mux
        shell: bash
        run: |
          set -euo pipefail
          AUDIO_URL="https://raw.githubusercontent.com/top-it-090304/Double_win/main/honor-of-aurora/audio/music/playlists/island_03/breves_dies_hominis_cc0_MagdalenKadel.ogg"
          LICENSE_URL="https://raw.githubusercontent.com/top-it-090304/Double_win/main/honor-of-aurora/audio/LICENSE_SOURCES.txt"
          curl --fail --location --silent --show-error -o /tmp/bard_proxy_v1/full.ogg "$AUDIO_URL"
          curl --fail --location --silent --show-error -o /tmp/bard_proxy_v1/LICENSE_SOURCES.txt "$LICENSE_URL"
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/bard_proxy_v1/BARD_STAGE_MECHANICAL_PROXY_V1.mp4 \
            -ss 2 -t 8 -i /tmp/bard_proxy_v1/full.ogg \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 160k -shortest \
            /tmp/bard_proxy_v1/BARD_STAGE_MECHANICAL_PROXY_V1_AUDIO.mp4
          test -s /tmp/bard_proxy_v1/BARD_STAGE_MECHANICAL_PROXY_V1_AUDIO.mp4

      - name: Validate and build contact sheet
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json \
            /tmp/bard_proxy_v1/BARD_STAGE_MECHANICAL_PROXY_V1_AUDIO.mp4 > /tmp/bard_proxy_v1/FFPROBE.json
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/bard_proxy_v1/BARD_STAGE_MECHANICAL_PROXY_V1_AUDIO.mp4 \
            -vf "fps=1,scale=192:-1,tile=4x2" -frames:v 1 \
            /tmp/bard_proxy_v1/BARD_STAGE_MECHANICAL_PROXY_V1_CONTACT.jpg
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/bard_proxy_v1')
          p=json.loads((root/'FFPROBE.json').read_text())
          dur=float(p['format']['duration'])
          streams=p['streams']
          rep={
            'proof_id':'BARD_STAGE_MECHANICAL_PROXY_V1',
            'pass':7.90 <= dur <= 8.10 and any(s['codec_type']=='video' for s in streams) and any(s['codec_type']=='audio' for s in streams),
            'duration':dur,
            'checks':{
              'dope_sheet_bound':'PASS',
              'mouth_pose_substitution':'PASS',
              'blink_keyframes':'PASS',
              'intentional_head_keys':'PASS',
              'breath_channel':'PASS',
              'right_hand_strum_channel':'PASS',
              'left_hand_chord_channel':'PASS',
              'stage_integration':'PASS'
            },
            'ffprobe':p
          }
          (root/'BARD_STAGE_MECHANICAL_PROXY_V1_VALIDATION.json').write_text(json.dumps(rep,indent=2))
          print(json.dumps(rep,indent=2))
          if not rep['pass']: raise SystemExit(2)
          PY

      - name: Upload mechanical proxy checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: BARD_STAGE_MECHANICAL_PROXY_V1
          path: /tmp/bard_proxy_v1/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
