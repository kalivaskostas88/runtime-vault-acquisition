name: BARD Vocal Alignment Whisper

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bard_vocal_alignment_whisper.yml"
      - "scripts/align_bard_vocal_whisper.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install alignment tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install faster-whisper
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Acquire frozen vocal and cut 8 seconds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp outputs_alignment
          curl --fail --location --silent --show-error -o tmp/full.ogg \
            https://raw.githubusercontent.com/top-it-090304/Double_win/main/honor-of-aurora/audio/music/playlists/island_03/breves_dies_hominis_cc0_MagdalenKadel.ogg
          ffmpeg -hide_banner -loglevel error -y -ss 2 -t 8 -i tmp/full.ogg -ac 1 -ar 16000 tmp/bard_test_8s_align.wav
          test -s tmp/bard_test_8s_align.wav

      - name: Run word-timestamp alignment probe
        run: python scripts/align_bard_vocal_whisper.py

      - name: Upload alignment
        uses: actions/upload-artifact@v4
        with:
          name: BARD_VOCAL_ALIGNMENT_WHISPER
          path: outputs_alignment/
          retention-days: 3
          if-no-files-found: error
