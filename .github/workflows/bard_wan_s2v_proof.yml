name: BARD Wan S2V Proof 001A

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/bard_wan_s2v_proof.yml"
      - "scripts/run_bard_wan_s2v.py"
      - "assets/bard_ref_320.jpg"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip gradio_client
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Acquire CC0 medieval vocal and cut frozen 4s sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp outputs
          AUDIO_URL="https://raw.githubusercontent.com/top-it-090304/Double_win/main/honor-of-aurora/audio/music/playlists/island_03/breves_dies_hominis_cc0_MagdalenKadel.ogg"
          LICENSE_URL="https://raw.githubusercontent.com/top-it-090304/Double_win/main/honor-of-aurora/audio/LICENSE_SOURCES.txt"
          curl --fail --location --silent --show-error --output tmp/full.ogg "$AUDIO_URL"
          curl --fail --location --silent --show-error --output tmp/LICENSE_SOURCES.txt "$LICENSE_URL"
          grep -i "breves_dies_hominis_cc0_MagdalenKadel.ogg" tmp/LICENSE_SOURCES.txt
          ffmpeg -hide_banner -loglevel error -y -ss 2 -t 4 -i tmp/full.ogg -ac 1 -ar 16000 tmp/bard_test_4s.wav
          test -s tmp/bard_test_4s.wav
          sha256sum assets/bard_ref_320.jpg tmp/bard_test_4s.wav > outputs/INPUT_SHA256.txt

      - name: Generate Wan2.2 S2V proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_bard_wan_s2v.py

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BARD_WAN_S2V_PROOF_001A
          path: |
            outputs/
            tmp/bard_test_4s.wav
            tmp/LICENSE_SOURCES.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
