name: Isolated Native Blender Facial Acting V011
on:
  push:
    branches: [research/native-facial-acting-v011-20261116]
    paths:
      - scripts/native_facial_closeup_v011.py
      - .github/workflows/native_facial_closeup_v011.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  facial-acting-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact pinned Blender archive when possible
        uses: actions/cache@v4
        with:
          path: ~/.cache/animation-blender/blender-5.2.2-linux-x64.tar.xz
          key: blender-522-linux-x64-84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168
      - name: Acquire and verify exact Blender 5.2.2 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/animation-blender" "$RUNNER_TEMP/blender522"
          ARCHIVE="$HOME/.cache/animation-blender/blender-5.2.2-linux-x64.tar.xz"
          EXPECTED='84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168'
          if [ ! -s "$ARCHIVE" ]; then
            echo 'Using official Blender download host'
            curl -fLsS --connect-timeout 30 --max-time 260 \
              -o "$ARCHIVE.tmp" 'https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz' || {
              echo 'Primary official download endpoint unavailable; testing official Blender mirror service'
              curl -fLsS --connect-timeout 30 --max-time 260 \
                -o "$ARCHIVE.tmp" 'https://mirror.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz'
            }
            mv "$ARCHIVE.tmp" "$ARCHIVE"
          fi
          printf '%s  %s\n' "$EXPECTED" "$ARCHIVE" | sha256sum -c -
          tar -xf "$ARCHIVE" -C "$RUNNER_TEMP/blender522"
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Install exact-version headless rendering libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1 ffmpeg
          blender --version | head -6
      - name: Build and independently reopen 3 original native facial rigs
        run: |
          set -euo pipefail
          for variant in THOUGHTFUL SYNCHRONIZED BAD_LID_BIND; do
            mkdir -p "facial_v011/$variant"
            blender -b --factory-startup --python scripts/native_facial_closeup_v011.py -- build "$variant" "facial_v011/$variant"
            blender -b "facial_v011/$variant/$variant.blend" --python scripts/native_facial_closeup_v011.py -- verify "$variant" "facial_v011/$variant"
          done
      - name: Render actual complete native facial animations and ffprobe
        run: |
          set -euo pipefail
          for variant in THOUGHTFUL SYNCHRONIZED BAD_LID_BIND; do
            mkdir -p "facial_v011/$variant/frames"
            blender -b "facial_v011/$variant/$variant.blend" -o "$GITHUB_WORKSPACE/facial_v011/$variant/frames/frame_####" -F PNG -s 1 -e 72 -a
            ffmpeg -hide_banner -loglevel error -y -framerate 24 -i "facial_v011/$variant/frames/frame_%04d.png" -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p "facial_v011/$variant/${variant}_NATIVE.mp4"
            ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,r_frame_rate,nb_read_frames -show_entries format=duration,size -of json "facial_v011/$variant/${variant}_NATIVE.mp4" > "facial_v011/$variant/${variant}_VIDEO_PROBE.json"
            test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "facial_v011/$variant/${variant}_NATIVE.mp4")" = '72'
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "facial_v011/$variant/${variant}_NATIVE.mp4")" = '24/1'
            rm -rf "facial_v011/$variant/frames"
          done
      - name: Verify immutable output manifest
        run: |
          set -euo pipefail
          for variant in THOUGHTFUL SYNCHRONIZED BAD_LID_BIND; do
            test -s "facial_v011/$variant/$variant.blend"
            test -s "facial_v011/$variant/${variant}_REOPEN.json"
            test -s "facial_v011/$variant/${variant}_frame_0032.png"
            test -s "facial_v011/$variant/${variant}_NATIVE.mp4"
          done
          find facial_v011 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > facial_v011/SHA256SUMS.txt
          test "$(wc -l < facial_v011/SHA256SUMS.txt)" -eq 33
          sha256sum -c facial_v011/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-native-facial-acting-v011
          path: facial_v011/
          retention-days: 7
          if-no-files-found: warn