name: temp-ace-official-voice-json
on:
  push:
    paths:
      - '.github/workflows/tmp-ace-vi-control-fetch.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official ACE female voice library JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --get 'https://studio-cms.acestudio.cn/api/voice-library-pages' \
            --data-urlencode 'locale=en' \
            --data-urlencode 'filters[slug][$eq]=female' \
            --data-urlencode 'pLevel=*' \
            --data-urlencode 'populate[localizations][fields][0]=locale' \
            --data-urlencode 'status=published' \
            -o out/female.json
          python - <<'PY'
          import json
          p='out/female.json'
          d=json.load(open(p,encoding='utf-8'))
          print('top',d.keys())
          print(json.dumps(d,ensure_ascii=False)[:20000])
          PY
      - name: Upload official JSON
        uses: actions/upload-artifact@v4
        with:
          name: ace-official-female-json
          path: out/
          retention-days: 1
