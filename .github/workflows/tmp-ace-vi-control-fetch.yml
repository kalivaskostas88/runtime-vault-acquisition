name: temp-ace-official-bundle-fetch
on:
  push:
    paths:
      - '.github/workflows/tmp-ace-vi-control-fetch.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official ACE site script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 2 'https://acestudio.ai/static/js/index.f87a253d-1790155126435.js' -o out/index.js
          wc -c out/index.js
          grep -oiE '.{0,300}(Emma|Celestia|Elirah|Bianca|Valentina|Karolyn|preview|audio).{0,700}' out/index.js | head -n 500 > out/matches.txt || true
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ace-official-bundle
          path: out/
          retention-days: 1
