name: temp-ace-independent-reference-fetch
on:
  push:
    paths:
      - '.github/workflows/tmp-ace-vi-control-fetch.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q 'yt-dlp[default,curl-cffi]' curl-cffi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p out
      - name: Fetch independent declared ACE references
        shell: bash
        run: |
          set -u
          declare -A URLS
          URLS[emma_spark]='https://www.youtube.com/watch?v=Siz-rZOvR84'
          URLS[emma_happens]='https://www.youtube.com/watch?v=UZlpvXsM3-s'
          URLS[bianca_arms]='https://www.youtube.com/watch?v=MMyYQyjJZPc'
          for name in "${!URLS[@]}"; do
            echo "=== $name ==="
            yt-dlp --impersonate chrome --no-playlist -f 'bestaudio/best' -x --audio-format wav --audio-quality 0 -o "out/${name}.%(ext)s" "${URLS[$name]}" || true
          done
          for f in out/*.wav; do
            [ -e "$f" ] || continue
            ffprobe -v error -show_entries format=duration,size,format_name:stream=codec_name,codec_type,sample_rate,channels -of default=noprint_wrappers=1 "$f" > "$f.ffprobe.txt"
          done
          ls -lah out
          test $(find out -maxdepth 1 -type f -name '*.wav' | wc -l) -ge 2
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-independent-references
          path: out/
          retention-days: 1
