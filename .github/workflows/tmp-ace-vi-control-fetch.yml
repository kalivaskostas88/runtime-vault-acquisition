name: temp-ace-official-route-chunks
on:
  push:
    paths:
      - '.github/workflows/tmp-ace-vi-control-fetch.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official ACE route chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail 'https://acestudio.ai/static/js/index.752b0b5e-1790155126435.js' -o out/slug.js
          curl -L --fail 'https://acestudio.ai/static/js/cmsApi.598165eb-1790155126435.js' -o out/cmsApi.js
          curl -L --fail 'https://acestudio.ai/static/js/index.97d592b7-1790155126435.js' -o out/vocal.js
          wc -c out/*.js
          grep -oiE '.{0,250}(preview|audio|voice|singer|cms|api|slug).{0,800}' out/slug.js | head -n 700 > out/slug_matches.txt || true
          grep -oiE '.{0,250}(http|api|cms).{0,800}' out/cmsApi.js | head -n 300 > out/cms_matches.txt || true
          grep -oiE '.{0,250}(Emma|Celestia|Elirah|Bianca|Valentina|Karolyn|preview|audio|voice).{0,800}' out/vocal.js | head -n 700 > out/vocal_matches.txt || true
      - name: Upload chunks
        uses: actions/upload-artifact@v4
        with:
          name: ace-official-route-chunks
          path: out/
          retention-days: 1
