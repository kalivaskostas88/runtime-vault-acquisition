name: temp-celestia-apple-preview-export
on:
  push:
    paths:
      - '.github/workflows/tmp-ai-detector-discovery.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Apple previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/audio
          python - <<'PY'
          import urllib.request, pathlib, json
          urls={
            't1_tavern_whispers':'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/2a/11/2a/2a112a00-6cb6-2770-d616-aed7dcf6d079/mzaf_10538498162576585059.plus.aac.p.m4a',
            't2_echoes_silver_moon':'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/e2/29/2c/e2292cac-8fed-7501-02db-96cab64b9dfe/mzaf_1910871341432373704.plus.aac.p.m4a',
            't3_lionhall':'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/9b/6d/e1/9b6de16f-a2b9-d7de-e969-dbd3bc5c5c2a/mzaf_136679358601734416.plus.aac.p.m4a'
          }
          rows=[]
          for name,url in urls.items():
              p=pathlib.Path('out/audio')/(name+'.m4a')
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              p.write_bytes(urllib.request.urlopen(req,timeout=90).read())
              rows.append({'name':name,'file':str(p),'bytes':p.stat().st_size})
          pathlib.Path('out/manifest.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          print('EXPORTED',len(rows))
          PY
      - name: Upload target previews
        uses: actions/upload-artifact@v4
        with:
          name: celestia-apple-target-audio
          path: out/
          retention-days: 1
