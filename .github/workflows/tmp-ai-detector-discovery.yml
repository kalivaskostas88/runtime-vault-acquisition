name: temp-tembrica-deep-calibration
on:
  push:
    paths:
      - '.github/workflows/tmp-ai-detector-discovery.yml'
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run independent deep detector on known ACE + targets
        shell: bash
        run: |
          set -u
          mkdir -p out/audio out/results
          python -m pip install -q selenium
          python - <<'PY' > out/run.log 2>&1
          import json, urllib.request, pathlib, re, time, traceback
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          UA={'User-Agent':'Mozilla/5.0'}
          files={}
          # Known synthetic singing control: official ACE Studio Lien preview
          try:
              api='https://studio-cms.acestudio.cn/api/voice-library-pages?locale=en&filters%5Bslug%5D%5B%24eq%5D=female&pLevel=*&populate%5Blocalizations%5D%5Bfields%5D%5B0%5D=locale&status=published'
              d=json.load(urllib.request.urlopen(urllib.request.Request(api,headers=UA),timeout=60))
              u=None
              for g in d['data'][0].get('voiceGroups',[]):
                  for v in g.get('voices',[]):
                      if v.get('name')=='Lien': u=(v.get('audioFile') or {}).get('url')
              assert u
              p=pathlib.Path('out/audio/known_ace_lien.mp3').resolve()
              p.write_bytes(urllib.request.urlopen(urllib.request.Request(u,headers={**UA,'Referer':'https://acestudio.ai/'}),timeout=90).read())
              files['known_ace_lien']=str(p)
          except Exception as e: print('ACE_DOWNLOAD_ERROR',repr(e))
          # Direct distributor previews for target songs
          urls={
            'target1_tavern_whispers':'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/2a/11/2a/2a112a00-6cb6-2770-d616-aed7dcf6d079/mzaf_10538498162576585059.plus.aac.p.m4a',
            'target2_echoes_silver_moon':'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/e2/29/2c/e2292cac-8fed-7501-02db-96cab64b9dfe/mzaf_1910871341432373704.plus.aac.p.m4a'
          }
          for k,u in urls.items():
              try:
                  p=pathlib.Path('out/audio')/(k+'.m4a'); p=p.resolve()
                  p.write_bytes(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90).read()); files[k]=str(p)
              except Exception as e: print('TARGET_DOWNLOAD_ERROR',k,repr(e))
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1600,1400'); opts.add_argument('--autoplay-policy=no-user-gesture-required')
          results={}
          for name,path in files.items():
              drv=None
              try:
                  drv=webdriver.Chrome(options=opts); drv.set_page_load_timeout(90); drv.get('https://tembrica.com/en/ai-detector')
                  wait=WebDriverWait(drv,60)
                  inp=wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'input[type=file]'))); inp.send_keys(path)
                  # Let quick analysis initialize.
                  time.sleep(8)
                  body0=drv.find_element(By.TAG_NAME,'body').text
                  pathlib.Path(f'out/results/{name}_quick.txt').write_text(body0,encoding='utf-8')
                  # Find and invoke deep analysis when enabled.
                  def deepbtn(d):
                      for b in d.find_elements(By.TAG_NAME,'button'):
                          if 'Run Deep Analysis' in (b.text or '') and b.is_enabled(): return b
                      return None
                  btn=WebDriverWait(drv,90).until(deepbtn); drv.execute_script('arguments[0].scrollIntoView({block:"center"}); arguments[0].click();',btn)
                  deadline=time.time()+300; last=''
                  while time.time()<deadline:
                      last=drv.find_element(By.TAG_NAME,'body').text
                      low=last.lower()
                      # Deep result has SONICS / stem sections and no active processing phrases.
                      if ('sonics' in low or 'combined verdict' in low) and not any(x in low for x in ['deep analysis running','analyzing…','analysing…','processing…','downloading model']):
                          time.sleep(3); last=drv.find_element(By.TAG_NAME,'body').text; break
                      time.sleep(5)
                  pathlib.Path(f'out/results/{name}_deep.txt').write_text(last,encoding='utf-8')
                  drv.save_screenshot(f'out/results/{name}.png')
                  lines=[x.strip() for x in last.splitlines() if x.strip()]
                  keys=('verdict','AI','human','SONICS','vocal','instrumental','confidence','probability','mixed','synthetic','deep analysis')
                  compact=[x for x in lines if any(k.lower() in x.lower() for k in keys)][:180]
                  results[name]={'ok':True,'bytes':pathlib.Path(path).stat().st_size,'compact':compact,'tail':lines[-80:]}
              except Exception as e:
                  results[name]={'ok':False,'error':repr(e),'traceback':traceback.format_exc()}
                  if drv:
                      try:
                          body=drv.find_element(By.TAG_NAME,'body').text; pathlib.Path(f'out/results/{name}_error.txt').write_text(body,encoding='utf-8'); drv.save_screenshot(f'out/results/{name}_error.png')
                      except: pass
              finally:
                  if drv:
                      try: drv.quit()
                      except: pass
          pathlib.Path('out/results.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          print(json.dumps(results,indent=2))
          PY
          cat out/results.json
      - name: Upload compact detector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tembrica-deep-calibration
          path: |
            out/results.json
            out/results/*
            out/run.log
          if-no-files-found: ignore
          retention-days: 1
