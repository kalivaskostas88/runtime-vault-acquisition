name: temp-ai-detector-client-inspect
on:
  push:
    paths:
      - '.github/workflows/tmp-ai-detector-discovery.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch detector function bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 2 'https://aimusicdetector.co/assets/detect.functions-JIdp_0T3.js' -o out/detect.functions.js
          python - <<'PY'
          from pathlib import Path
          import re,json
          t=Path('out/detect.functions.js').read_text(encoding='utf-8',errors='ignore')
          pats=['_serverFn','supabase','functions/v1','detect','analy','provider','audioBase64','contentHash']
          hits=[]
          for p in pats:
              for m in re.finditer(p,t,re.I):
                  a=max(0,m.start()-1000);b=min(len(t),m.end()+1800)
                  hits.append({'term':p,'offset':m.start(),'snippet':t[a:b]})
          Path('out/hits.json').write_text(json.dumps(hits[:120],indent=2),encoding='utf-8')
          print('CLIENT_INSPECTED',len(t),len(hits))
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: ai-detector-client-inspect
          path: out/
          retention-days: 1
