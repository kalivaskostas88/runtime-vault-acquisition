name: temp-ai-detector-ui-calibration
on:
  push:
    paths:
      - '.github/workflows/tmp-ai-detector-discovery.yml'
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Run public detector UI on known ACE AI preview
        shell: bash
        run: |
          set -u
          mkdir -p out
          python -m pip install -q selenium
          python - <<'PY' > out/run.log 2>&1
          import json, urllib.request, pathlib, time, re, traceback
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          result={}
          try:
              api='https://studio-cms.acestudio.cn/api/voice-library-pages?locale=en&filters%5Bslug%5D%5B%24eq%5D=female&pLevel=*&populate%5Blocalizations%5D%5Bfields%5D%5B0%5D=locale&status=published'
              d=json.load(urllib.request.urlopen(urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'}),timeout=60))
              url=None
              for g in d['data'][0].get('voiceGroups',[]):
                  for v in g.get('voices',[]):
                      if v.get('name')=='Lien': url=(v.get('audioFile') or {}).get('url')
              assert url
              audio=pathlib.Path('out/lien_known_ai.mp3').resolve()
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://acestudio.ai/'})
              audio.write_bytes(urllib.request.urlopen(req,timeout=90).read())
              result['audio_bytes']=audio.stat().st_size
              opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1400,1200')
              drv=webdriver.Chrome(options=opts)
              drv.get('https://aimusicdetector.co/')
              wait=WebDriverWait(drv,40)
              inp=wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'input[type=file]')))
              inp.send_keys(str(audio))
              btn=wait.until(lambda d: next((b for b in d.find_elements(By.TAG_NAME,'button') if 'Analyse for AI music' in b.text),None))
              drv.execute_script('arguments[0].click()',btn)
              deadline=time.time()+150
              body=''
              while time.time()<deadline:
                  body=drv.find_element(By.TAG_NAME,'body').text
                  if any(x in body for x in ['AI probability','Inconclusive','AI-generated music','Not AI-generated','Analysis could not be completed']):
                      if 'Analysing…' not in body: break
                  time.sleep(3)
              result['body_text']=body[-12000:]
              pathlib.Path('out/page_text.txt').write_text(body,encoding='utf-8')
              drv.save_screenshot('out/result.png')
              drv.quit()
              result['ok']=True
          except Exception as e:
              result['ok']=False; result['error']=repr(e); result['traceback']=traceback.format_exc()
          pathlib.Path('out/result.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result))
          PY
          cat out/result.json
      - name: Upload calibration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-detector-ui-calibration
          path: |
            out/result.json
            out/page_text.txt
            out/result.png
            out/run.log
          if-no-files-found: ignore
          retention-days: 1
