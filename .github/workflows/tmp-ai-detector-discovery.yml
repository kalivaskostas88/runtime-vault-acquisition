name: temp-nonace-control-export
on:
  push:
    paths:
      - '.github/workflows/tmp-ai-detector-discovery.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download Apple previews for declared non-ACE synth vocals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/audio
          python - <<'PY'
          import urllib.request, json, pathlib
          ids={
            'voisona_chisa_golden_afternoon':1673687775,
            'synthv_solaria_dawn':1604618122,
            'synthv_gumi_copycat_sv':1764201902,
            'vocaloid_miku_puzzle':1688188316,
          }
          rows=[]
          for name,tid in ids.items():
              api=f'https://itunes.apple.com/lookup?id={tid}'
              d=json.load(urllib.request.urlopen(urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'}),timeout=60))
              r=d['results'][0]
              url=r.get('previewUrl')
              if not url:
                  rows.append({'name':name,'trackId':tid,'error':'no_preview'}); continue
              p=pathlib.Path('out/audio')/(name+'.m4a')
              p.write_bytes(urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=90).read())
              rows.append({'name':name,'trackId':tid,'trackName':r.get('trackName'),'artistName':r.get('artistName'),'previewUrl':url,'file':str(p),'bytes':p.stat().st_size})
          pathlib.Path('out/manifest.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          print(json.dumps(rows,indent=2))
          PY
      - name: Upload controls
        uses: actions/upload-artifact@v4
        with:
          name: nonace-synthetic-controls
          path: out/
          retention-days: 1
