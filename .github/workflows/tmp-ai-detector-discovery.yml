name: temp-celestia-direct-detector-pass
on:
  push:
    paths:
      - '.github/workflows/tmp-ai-detector-discovery.yml'
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Acquire direct public tracks and run detector UI
        shell: bash
        run: |
          set -u
          mkdir -p out/audio out/results
          python -m pip install -q yt-dlp selenium
          python - <<'PY' > out/run.log 2>&1
          import subprocess, pathlib, json, time, traceback, os, re
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          tracks={
            't1_tavern_whispers':'https://audiomack.com/celestia-song/song/tavern-whispers',
            't2_echoes_silver_moon':'https://audiomack.com/celestia-song/song/echoes-through-the-silver-moon',
            't3_lionhall':'https://audiomack.com/celestia-song/song/the-lionhall-celebration',
          }
          acquired={}
          for name,url in tracks.items():
              templ=f'out/audio/{name}.%(ext)s'
              cp=subprocess.run(['yt-dlp','--no-playlist','-f','bestaudio/best','-o',templ,url],capture_output=True,text=True,timeout=180)
              files=list(pathlib.Path('out/audio').glob(name+'.*'))
              acquired[name]={'url':url,'returncode':cp.returncode,'stdout':cp.stdout[-3000:],'stderr':cp.stderr[-3000:],'file':str(files[0]) if files else None,'bytes':files[0].stat().st_size if files else 0}
          pathlib.Path('out/acquisition.json').write_text(json.dumps(acquired,indent=2),encoding='utf-8')
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1400,1200')
          allres={}
          for name,meta in acquired.items():
              if not meta['file']: allres[name]={'error':'acquisition_failed'}; continue
              drv=None
              try:
                  audio=pathlib.Path(meta['file']).resolve()
                  drv=webdriver.Chrome(options=opts); drv.get('https://aimusicdetector.co/')
                  wait=WebDriverWait(drv,50)
                  inp=wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'input[type=file]'))); inp.send_keys(str(audio))
                  btn=wait.until(lambda d: next((b for b in d.find_elements(By.TAG_NAME,'button') if 'Analyse for AI music' in b.text),None))
                  drv.execute_script('arguments[0].click()',btn)
                  deadline=time.time()+180; body=''
                  while time.time()<deadline:
                      body=drv.find_element(By.TAG_NAME,'body').text
                      if 'AI MUSIC DETECTION RESULT' in body and 'Analysing…' not in body: break
                      if 'Analysis could not be completed' in body: break
                      time.sleep(3)
                  pathlib.Path(f'out/results/{name}.txt').write_text(body,encoding='utf-8')
                  drv.save_screenshot(f'out/results/{name}.png')
                  # Extract compact report lines around the result card.
                  lines=[x.strip() for x in body.splitlines() if x.strip()]
                  keys=('AI MUSIC DETECTION RESULT','AI-generated','No AI-generated','Inconclusive','Vocal AI','Instrumental AI','Coverage','confidence','Full track analysed')
                  compact=[x for x in lines if any(k.lower() in x.lower() for k in keys)][:80]
                  allres[name]={'ok':True,'bytes':audio.stat().st_size,'compact':compact}
              except Exception as e:
                  allres[name]={'ok':False,'error':repr(e),'traceback':traceback.format_exc()}
              finally:
                  if drv:
                      try: drv.quit()
                      except: pass
          pathlib.Path('out/results.json').write_text(json.dumps(allres,indent=2),encoding='utf-8')
          print(json.dumps({'acquired':{k:{'rc':v['returncode'],'bytes':v['bytes'],'file':v['file']} for k,v in acquired.items()},'results':allres},indent=2))
          PY
          cat out/acquisition.json
          cat out/results.json
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celestia-direct-detector-pass
          path: |
            out/acquisition.json
            out/results.json
            out/results/*.txt
            out/results/*.png
            out/run.log
          if-no-files-found: ignore
          retention-days: 1
