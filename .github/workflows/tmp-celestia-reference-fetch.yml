name: temp-celestia-embedding-tool-fetch

on:
  push:
    branches:
      - tmp/celestia-reference-fetch-20260923

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Resemblyzer package with pretrained model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m pip download --no-deps 'Resemblyzer==0.1.4' -d out
          ls -lh out
      - name: Upload temporary tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: resemblyzer-package
          path: out/
          retention-days: 1
