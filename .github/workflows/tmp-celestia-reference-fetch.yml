name: temp-ace-emma-reference-fetch

on:
  push:
    branches:
      - tmp/celestia-reference-fetch-20260923

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare yt-dlp impersonation
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'yt-dlp[default,curl-cffi]' curl-cffi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Fetch declared ACE Emma reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://audio.com/schnickltoven/audio/precious-to-me-emma-ace-vocal-music'
          yt-dlp --impersonate chrome --extractor-args 'generic:impersonate' --no-playlist -f 'bestaudio/best' -o 'out/emma_reference.%(ext)s' "$URL"
          MEDIA=$(find out -type f -name 'emma_reference.*' | head -n1)
          ffprobe -v error -show_entries format=duration,size,format_name:stream=codec_name,codec_type,sample_rate,channels -of default=noprint_wrappers=1 "$MEDIA" | tee out/ffprobe.txt
      - name: Upload temporary Emma artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-emma-reference
          path: out/
          retention-days: 1
