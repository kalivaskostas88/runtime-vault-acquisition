name: tmp-lofcz-album-map
on:
  push:
    paths:
      - '.github/workflows/tmp-lofcz-celestia.yml'
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: Run frozen detector across albums
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy==1.26.4 scipy==1.13.1 librosa==0.10.2.post1 onnxruntime huggingface_hub requests soundfile
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p out
          python - <<'PY' > out/run.txt 2>&1 || true
          import json,requests,re,subprocess,numpy as np,librosa,onnxruntime as ort
          from pathlib import Path
          from scipy.ndimage import minimum_filter1d
          from huggingface_hub import hf_hub_download
          albums=['Fjord Lullaby','Harbor Bright','Whispers Beyond Time','Firelight and Fiddles','Tavern Whispers','The Lionhall Celebration','Black Tide Serenade']
          model=hf_hub_download('lofcz/ai-music-detector','ai_music_detector.onnx'); sess=ort.InferenceSession(model,providers=['CPUExecutionProvider']); inp=sess.get_inputs()[0].name; nf=sess.get_inputs()[0].shape[1]
          sr=16000;nfft=8192;freq=np.linspace(0,sr/2,nfft//2+1);mask=(freq>=1000)&(freq<=8000)
          def prob(wav):
            y,_=librosa.load(wav,sr=sr,mono=True,duration=30); S=np.abs(librosa.stft(y,n_fft=nfft,hop_length=nfft//2,win_length=nfft,window='hann',center=True,pad_mode='reflect'))**2; db=10*np.log10(np.clip(S,1e-10,1e6)); fs=db.mean(axis=1)[mask]; hull=np.clip(minimum_filter1d(fs,size=10,mode='nearest'),-45,None); fp=np.clip(np.clip(fs-hull,0,None),0,5); fp=(fp/(fp.max()+1e-6)).astype(np.float32)
            if len(fp)!=nf: fp=np.interp(np.linspace(0,1,nf),np.linspace(0,1,len(fp)),fp).astype(np.float32)
            return float(sess.run(None,{inp:fp.reshape(1,-1)})[0][0,0])
          rows=[]
          for album in albums:
            j=requests.get('https://itunes.apple.com/search',params={'term':f'celestia song {album}','entity':'song','limit':100,'country':'US'},timeout=60).json(); xs=[x for x in j.get('results',[]) if x.get('previewUrl') and (x.get('artistName') or '').lower()=='celestia song' and (x.get('collectionName') or '').lower()==album.lower()]; xs=sorted(xs,key=lambda x:x.get('trackNumber') or 999)[:2]
            for x in xs:
              n=re.sub(r'[^a-z0-9]+','_',album.lower()).strip('_')+f"_{x.get('trackNumber',0):02d}"; rr=requests.get(x['previewUrl'],timeout=60); rr.raise_for_status(); src=Path('/tmp')/(n+'.m4a'); wav=Path('/tmp')/(n+'.wav'); src.write_bytes(rr.content); subprocess.run(['ffmpeg','-loglevel','error','-y','-i',str(src),'-ac','1','-ar','16000',str(wav)],check=True); rows.append({'album':album,'track':x.get('trackName'),'trackNumber':x.get('trackNumber'),'releaseDate':x.get('releaseDate'),'probability':prob(str(wav))})
          Path('out/album_map.json').write_text(json.dumps(rows,indent=2),encoding='utf-8'); print(json.dumps(rows))
          PY
      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: lofcz-album-map
          path: out/
          retention-days: 1
