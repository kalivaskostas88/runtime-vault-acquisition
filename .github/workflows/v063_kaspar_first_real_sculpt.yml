name: V063 Kaspar first real native sculpt brush proof
on:
  push:
    branches:
      - research/animation-v063-kaspar-native-sculpt-stroke-20261118
    paths:
      - .github/workflows/v063_kaspar_first_real_sculpt.yml
      - research/animation_v063/native_kaspar_sphere_sculpt_v063.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teacher-first-native-brush:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Acquire exact vendor-verified Blender 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xf blender-5.2.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Install headless OpenGL libs and verify Blender version
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1
          blender --version | head -6
      - name: Execute actual native sculpt brush, original teacher exercise sphere
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native_v063
          blender -b --factory-startup --python research/animation_v063/native_kaspar_sphere_sculpt_v063.py -- build native_v063
      - name: Independently fresh-reopen native .blend and compare geometry hashes
        run: |
          set -euo pipefail
          blender -b native_v063/SCULPT.blend --python research/animation_v063/native_kaspar_sphere_sculpt_v063.py -- verify native_v063
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('native_v063')
          r=json.loads((p/'BUILD_RECEIPT.json').read_text())
          assert r['native_proof_pass'] and r['real_mesh_changed'] and r['brush_asset']=='Draw'
          assert (p/'REOPEN_RECEIPT.json').exists()
          pngs=list(p.glob('*.png'))
          assert len(pngs)==6, [str(x) for x in pngs]
          for x in [*pngs,p/'BASE.blend',p/'SCULPT.blend']:
            assert x.stat().st_size>1000, str(x)
          print('V063_REAL_NATIVE_BRUSH AND REOPEN VERIFIED; ART HOLD',r['bpy_version'])
          PY
          sha256sum native_v063/*.blend native_v063/*.png native_v063/*.json > native_v063/SHA256SUMS.txt
      - name: Publish original native evidence, not art approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v063-first-real-native-draw-brush-evidence
          path: native_v063/
          retention-days: 5
          if-no-files-found: warn
# V063_REPRODUCIBILITY_REPEAT: unchanged Blender script and stroke inputs; repeat evidence
