name: V064 real teacher-taught Smooth on saved V063 Blender model
on:
  push:
    branches:
      - research/animation-v064-kaspar-smooth-native-20261118
    paths:
      - .github/workflows/v064_native_smooth_on_saved_v063.yml
      - research/animation_v064/native_kaspar_smooth_on_v063.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prove-native-smooth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Recover EXACT original repaired .blend from V063 successful native run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v064_v063_input
          gh run download 44305384790 --repo kalivaskostas88/runtime-vault-acquisition -n v063-first-real-native-draw-brush-evidence -D v064_v063_input
          test -s v064_v063_input/SCULPT.blend
          test -s v064_v063_input/BUILD_RECEIPT.json
          python - <<'PY'
          import json
          d=json.load(open('v064_v063_input/BUILD_RECEIPT.json'))
          assert d['sculpted']['position_sha256']=='123e2a9a0ab77b9b0d5872686a3c98057eb6d939e2cdaa99382d367808877ec9'
          assert d['brush_asset']=='Draw' and abs(d['brush_strength']-0.16)<1e-6
          print('V064_ORIGINAL_V063_SOURCE_GATE_PASS',d['sculpted']['position_sha256'])
          PY
          sha256sum v064_v063_input/SCULPT.blend
      - name: Acquire exact Blender 5.2.2 verified by vendor SHA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xf blender-5.2.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Headless graphics dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1
          blender --version | head -6
      - name: Apply REAL native Smooth asset brush to the ACTUAL V063 repaired .blend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native_v064
          blender -b v064_v063_input/SCULPT.blend --python research/animation_v064/native_kaspar_smooth_on_v063.py -- build native_v064
      - name: Reopen saved .blend and verify geometry; no art claim
        shell: bash
        run: |
          set -euo pipefail
          blender -b native_v064/SMOOTH.blend --python research/animation_v064/native_kaspar_smooth_on_v063.py -- verify native_v064
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('native_v064')
          r=json.loads((p/'SMOOTH_ACTUAL_BUILD_RECEIPT.json').read_text())
          assert r['technical_pass'],r
          assert r['native_asset']=='Smooth' and r['volume_reduced']
          assert r['moved_vertices']>0 and r['same_topology']
          assert len(list(p.glob("BEFORE_*.png")))==3
          assert len(list(p.glob("AFTER_*.png")))==3
          assert (p/'SMOOTH.blend').stat().st_size>1000
          print("V064_REAL_NATIVE_SMOOTH_TECHNICALLY_PROVED; ART_HOLD",r['volume_delta_percent'])
          PY
          sha256sum native_v064/*.blend native_v064/*.png native_v064/*.json > native_v064/SHA256SUMS.txt
      - name: Publish original native evidence, including honest failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v064-real-native-smooth-original-v063-model
          path: native_v064/
          retention-days: 5
          if-no-files-found: warn
# V064_REPEAT_CHECK: unchanged Smooth script and original V063 source file; independent rerun.
