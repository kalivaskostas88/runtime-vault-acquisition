name: V065 authentic Flatten and Scrape native plane-brush comparison
on:
  push:
    branches:
      - research/animation-v065-kaspar-plane-brush-20261118
    paths:
      - .github/workflows/v065_real_plane_brush_ab.yml
      - research/animation_v065/actual_native_plane_brush_comparison.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-blender-plane-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact V063 repaired source file, not regenerate a substitute
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original_v063
          gh run download 44305384790 --repo kalivaskostas88/runtime-vault-acquisition -n v063-first-real-native-draw-brush-evidence -D original_v063
          test -s original_v063/SCULPT.blend
          echo "f4f62d23cd0fc5167513825fffd36ab9b82e98d198d50d49feb44e86040d2ecc  original_v063/SCULPT.blend" | sha256sum -c -
          python - <<'PY'
          import json
          d=json.load(open('original_v063/BUILD_RECEIPT.json'))
          assert d['sculpted']['position_sha256']=='123e2a9a0ab77b9b0d5872686a3c98057eb6d939e2cdaa99382d367808877ec9'
          print('V065_PREVIOUS_NATIVE_SOURCE_VERIFIED',d['sculpted']['position_sha256'])
          PY
      - name: Download official Blender 5.2.2 and check vendor manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xf blender-5.2.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Headless graphics and input preflight
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1
          blender --version | head -5
      - name: Actual native Flatten/Contrast from exact same source .blend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v065_native/flatten
          blender -b original_v063/SCULPT.blend --python research/animation_v065/actual_native_plane_brush_comparison.py -- flatten v065_native/flatten
          blender -b v065_native/flatten/RESULT.blend --python research/animation_v065/actual_native_plane_brush_comparison.py -- verify v065_native/flatten
      - name: Actual native Scrape/Fill from exact same source .blend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v065_native/scrape
          blender -b original_v063/SCULPT.blend --python research/animation_v065/actual_native_plane_brush_comparison.py -- scrape v065_native/scrape
          blender -b v065_native/scrape/RESULT.blend --python research/animation_v065/actual_native_plane_brush_comparison.py -- verify v065_native/scrape
      - name: Independent measurable A/B summary, not automatic artistic praise
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('v065_native')
          d={k:json.loads((p/k/'BUILD_RECEIPT.json').read_text()) for k in ['flatten','scrape']}
          for k,r in d.items():
            assert r['case']==k and r['native_geometry_changed'] and r['technical_pass']
            assert r['actual_brush_type']=='PLANE'
            assert r['before']['position_sha256']=='123e2a9a0ab77b9b0d5872686a3c98057eb6d939e2cdaa99382d367808877ec9'
            assert (p/k/'REOPEN_RECEIPT.json').exists()
            assert len(list((p/k).glob('*.png')))==6
            assert (p/k/'RESULT.blend').stat().st_size>1000
          comparison={'schema':'V065_NATIVE_PLANE_BRUSH_AB',
             'same_input_mesh':True,'tools':['Flatten/Contrast','Scrape/Fill'],
             'sources':[d[k]['source'] for k in d],
             'strength_same':d['flatten']['strength']==d['scrape']['strength'],
             'stroke_count_same':d['flatten']['events']==d['scrape']['events'],
             'position_shas_different':d['flatten']['after']['position_sha256']!=d['scrape']['after']['position_sha256'],
             'outcomes':{k:{'volume_delta_percent':r['volume_delta_percent'],
              'plane_rmse_before':r['roi_flatness_before']['plane_rmse'],
              'plane_rmse_after':r['roi_flatness_after']['plane_rmse'],
              'plane_rmse_delta':r['roi_flatness_rmse_delta'],
              'local_plane_improved':r['roi_flatness_improved'],
              'moved_vertices':r['moved_vertices']} for k,r in d.items()},
             'independent_art_approval':False,
             'plane_improvement_not_assumed':True}
          (p/'COMPARE_ACTUAL.json').write_text(json.dumps(comparison,indent=2)+'\n')
          print("V065_MEASURED_AB_COMPARISON",json.dumps(comparison))
          PY
          find v065_native -type f \( -name '*.blend' -o -name '*.png' -o -name '*.json' \) -print0 | sort -z | xargs -0 sha256sum > v065_native/SHA256SUMS.txt
      - name: Preserve actual outcomes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v065-real-blender-plane-flatten-scrape-ab
          path: v065_native/
          retention-days: 7
          if-no-files-found: warn

# V065_REPEAT: original source, Blender build, strokes and native script unchanged; independent repeat.
