name: V067 real Sculpt Mask protects original V063 native geometry
on:
  push:
    branches:
      - research/animation-v067-native-mask-protection-20261118
    paths:
      - .github/workflows/v067_native_mask_protection.yml
      - research/animation_v067/native_mask_protection_from_v063.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-mask-versus-control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Recover unmodified V063 repaired source and validate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original_v063
          gh run download 44305384790 --repo kalivaskostas88/runtime-vault-acquisition -n v063-first-real-native-draw-brush-evidence -D original_v063
          echo "f4f62d23cd0fc5167513825fffd36ab9b82e98d198d50d49feb44e86040d2ecc  original_v063/SCULPT.blend" | sha256sum -c -
          test -s original_v063/BUILD_RECEIPT.json
      - name: Verified Blender 5.2.2 vendor binary, no paid service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xf blender-5.2.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Headless graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1
          blender --version | head -6
      - name: Control — Draw on native unmasked saved source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v067_native/control
          blender -b original_v063/SCULPT.blend --python research/animation_v067/native_mask_protection_from_v063.py -- control v067_native/control
          blender -b v067_native/control/RESULT.blend --python research/animation_v067/native_mask_protection_from_v063.py -- verify v067_native/control
      - name: Treatment — paint true native Mask then SAME Draw stroke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v067_native/masked
          blender -b original_v063/SCULPT.blend --python research/animation_v067/native_mask_protection_from_v063.py -- masked v067_native/masked
          blender -b v067_native/masked/RESULT.blend --python research/animation_v067/native_mask_protection_from_v063.py -- verify v067_native/masked
      - name: Independent quantitative protection gate (predeclared)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('v067_native')
          c=json.loads((p/'control'/'BUILD_RECEIPT.json').read_text())
          m=json.loads((p/'masked'/'BUILD_RECEIPT.json').read_text())
          assert c['before']==m['before'] and c['source_blend_sha']==m['source_blend_sha']
          assert c['draw_stroke']['events']==m['draw_stroke']['events']==75
          assert c['draw_stroke']['strength']==m['draw_stroke']['strength']
          assert c['draw_stroke']['size']==m['draw_stroke']['size']
          assert m['mask_only_geometry']['sha']==m['before']['sha']
          assert m['mask_stroke']['brush']=='Mask'
          assert m['mask_gt_09']>=15
          affected=[i for i,(mask,d) in enumerate(zip(m['mask_values'],c['draw_displacements'])) if mask>=0.9 and d>1e-4]
          displacement_control=sum(c['draw_displacements'][i] for i in affected)
          displacement_masked=sum(m['draw_displacements'][i] for i in affected)
          ratio=displacement_masked/displacement_control if displacement_control>1e-4 else None
          check=dict(schema='V067_ACTUAL_MASK_PROTECTION_AB',verified_native=True,
           source_mesh_sha=c['before']['sha'],mask_strong_vertices=m['mask_gt_09'],
           meaningful_overlap_vertices=len(affected),control_displacement_sum=displacement_control,
           masked_displacement_sum=displacement_masked,protection_ratio=ratio,
           total_control_moved=c['changed_vertices'],total_treatment_moved=m['changed_vertices'],
           technical_protection_pass=(ratio is not None and len(affected)>=15 and displacement_control>0.05 and ratio<0.30),
           threshold_set_before_execution={'min_overlap':15,'min_unmasked_control_movement':0.05,'ratio_max_exclusive':0.30},
           masks_nonzero=True,artist_approved=False,source='Blender 5.2.2 native brush actions on actual V063 model')
          (p/'PROTECTION_COMPARE.json').write_text(json.dumps(check,indent=2)+'\n')
          print('V067_ACTUAL_PROTECTION_COMPARISON',json.dumps(check))
          assert check['technical_protection_pass'],'Controlled mask protection NOT established; artifact preserved'
          PY
          find v067_native -type f -print0 | sort -z | xargs -0 sha256sum > v067_native/SHA256SUMS.txt
      - name: Preserve actual outcomes including honest failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v067-real-native-sculpt-mask-protection-artifact
          path: v067_native/
          retention-days: 7
          if-no-files-found: warn

# V067_INDEPENDENT_REPEAT: same frozen Mask and Draw script and same V063 input; no parameter changes.
