name: V068 first real original elephant sculpt blockout from teacher and CC0 views
on:
  push:
    branches:
      - research/animation-v068-pro-elephant-blockout-20261119
    paths:
      - .github/workflows/v068_elephant_original_masses.yml
      - research/animation_v068/build_original_elephant_masses.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-small-creative-blockout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve previously verified CC0 orthographic source; never import existing 3D model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v068_reference
          gh run download 44458138018 --repo kalivaskostas88/runtime-vault-acquisition -n v068-real-polyhaven-cc0-elephant-reference -D v068_reference
          test -s v068_reference/V068_REFERENCE_CAPTURE_RECEIPT.json
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('v068_reference')
          r=json.loads((p/'V068_REFERENCE_CAPTURE_RECEIPT.json').read_text())
          assert len(r['images'])==3
          for n,x in r['images'].items():
            b=(p/(n+'.png')).read_bytes()
            assert b[:4]==b'\x89PNG' and hashlib.sha256(b).hexdigest()==x['sha256']
          print("V068_LICENSED_CC0_REFERENCE_3_VIEWS_VERIFIED")
          PY
      - name: Official Blender 5.2.2 with real vendor checksum verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          # Mirror service is officially operated by Blender Foundation; checksum is mandatory.
          if ! curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz; then
            curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://mirror.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          fi
          if ! curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256; then
            curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://mirror.blender.org/release/Blender5.2/blender-5.2.2.sha256
          fi
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xf blender-5.2.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Headless Blender prerequisites
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1
          blender --version | head -6
      - name: Build original small artistic figurine blockout, multi-angle native renders
        shell: bash
        run: |
          set -euo pipefail
          blender -b --factory-startup --python research/animation_v068/build_original_elephant_masses.py
          test -s v068_blockout/V068_ELEPHANT_MASS_BLOCKOUT.blend
          test -s v068_blockout/V068_BLOCKOUT_BUILD_RECEIPT.json
      - name: Open actual .blend again in fresh Blender process and inspect real objects
        shell: bash
        run: |
          set -euo pipefail
          blender -b v068_blockout/V068_ELEPHANT_MASS_BLOCKOUT.blend --python-expr "import bpy; a=[x for x in bpy.data.objects if x.get('stage')=='BLOCKOUT_NOT_FINAL']; assert len(a)>=12; assert len([x for x in a if x.name.startswith('07_LEG_')])==4; assert len([x for x in bpy.data.images if x.packed_file])>=3; print('V068_FRESH_BLEND_REOPEN_REAL_MASSES_AND_PACKED_REFERENCES_PASS',len(a))"
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('v068_blockout')
          r=json.loads((p/'V068_BLOCKOUT_BUILD_RECEIPT.json').read_text())
          assert r['art_stage']=='FIRST_BLOCKOUT_ONLY' and r['full_art_approval']==False
          assert len(r['rendered_views'])==4 and len(r['reference_image_evidence'])==3
          for name,sha in r['render_sha256'].items():
              f=p/name
              assert f.stat().st_size>1000 and hashlib.sha256(f.read_bytes()).hexdigest()==sha
          print('V068_TECHNICAL_AND_SOURCE_RECEIPTS_PASS; ART_REVIEW_REQUIRED')
          PY
          find v068_blockout -type f -print0 | sort -z | xargs -0 sha256sum > v068_blockout/SHA256SUMS.txt
      - name: Publish real original Blender evidence, including honest failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v068-original-elephant-teacher-first-mass-blockout
          path: v068_blockout/
          retention-days: 7
          if-no-files-found: warn
