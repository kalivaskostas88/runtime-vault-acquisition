name: V072 Professional Targeted Smooth on Native V071 Torso
on:
  push:
    branches:
      - research/animation-v072-targeted-body-smooth-20261119
    paths:
      - .github/workflows/v072_targeted_native_smooth.yml
      - research/animation_v072/native_targeted_smooth.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-smooth-small-mechanical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified V071 original output and validate source SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v071_body_fusion
          gh run download 44465175280 --repo kalivaskostas88/runtime-vault-acquisition -n v071-actual-three-mass-blender-proof -D v071_body_fusion
          test -s v071_body_fusion/V071_THREE_BODY_FUSION_CANDIDATE.blend
          echo "098b83455277022cab496f67e2ecf2959703c90e55f56a89bc8eae6534c4554d  v071_body_fusion/V071_THREE_BODY_FUSION_CANDIDATE.blend" | sha256sum -c -
      - name: Download official Blender 5.2.2 with vendor SHA, official mirror fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          if ! curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz; then
            curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://mirror.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          fi
          if ! curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256; then
            curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://mirror.blender.org/release/Blender5.2/blender-5.2.2.sha256
          fi
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xf blender-5.2.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Install actual headless viewport Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1
      - name: Do one real native professional Smooth brush stroke on disposable candidate
        shell: bash
        run: |
          set -euo pipefail
          blender -b --python research/animation_v072/native_targeted_smooth.py
          test -s v072_targeted_smooth/V072_SMALL_SMOOTH_CANDIDATE.blend
          test -s v072_targeted_smooth/V072_SCOPED_SMOOTH_RECEIPT.json
      - name: Independent fresh reopen and scoped evidence gate
        shell: bash
        run: |
          set -euo pipefail
          blender -b v072_targeted_smooth/V072_SMALL_SMOOTH_CANDIDATE.blend --python-expr "import bpy; o=bpy.data.objects['01_BARREL_BODY']; assert o.get('stage')=='V072_SMALL_NATIVE_SMOOTH_CANDIDATE_ART_HOLD'; assert len([i for i in bpy.data.images if i.packed_file])>=3; print('V072_ACTUAL_SAVED_SMOOTH_REOPEN_PASS')"
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('v072_targeted_smooth')
          d=json.loads((p/'V072_SCOPED_SMOOTH_RECEIPT.json').read_text())
          assert d['status'].startswith('NATIVE_TARGETED_SMOOTH_MECHANICAL_PASS') and d['art_approved'] is False
          assert d['moved_vertices']>20 and d['native_brush']=='Smooth'
          for name,h in {**d['before_renders'],**d['after_renders']}.items():
            assert hashlib.sha256((p/name).read_bytes()).hexdigest()==h
          assert hashlib.sha256((p/'V072_SMALL_SMOOTH_CANDIDATE.blend').read_bytes()).hexdigest()==d['saved_blend_sha256']
          print('V072_GENUINE_NATIVE_PROOF_ART_HOLD')
          PY
          find v072_targeted_smooth -type f -print0 | sort -z | xargs -0 sha256sum > v072_targeted_smooth/SHA256SUMS.txt
      - name: Persist actual scoped run evidence or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v072-teacher-targeted-native-smooth-evidence
          path: v072_targeted_smooth/
          retention-days: 7
          if-no-files-found: warn
