name: V076 Real Native Curve-Guided Elephant Ear Upper Rim Proof
on:
  push:
    branches:
      - research/animation-v076-native-curve-elephant-ear-fold-20261119
    paths:
      - .github/workflows/v076_native_elephant_ear_curve_rim.yml
      - research/animation_v076/original_curve_guided_elephant_ear_roll.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-curve-control-teacher-application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact V075 sculpted original and check SHA before edit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v075_ear_grab
          gh run download 44493357772 --repo kalivaskostas88/runtime-vault-acquisition -n v075-real-original-grab-ear-contour-evidence -D v075_ear_grab
          echo "741b6b912216b48fa7fe6edacaa96a3b630b08a31277412b3d1bee66d952de4c  v075_ear_grab/V075_REAL_GRAB_EAR_CONTOUR_CANDIDATE.blend" | sha256sum -c -
      - name: Download official Blender 5.2.2 with vendor SHA; official mirror fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender522"
          cd "$RUNNER_TEMP/blender522"
          if ! curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz; then
            curl -fLsS --connect-timeout 30 --max-time 300 -o blender-5.2.2-linux-x64.tar.xz https://mirror.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          fi
          if ! curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256; then
            curl -fLsS --connect-timeout 30 --max-time 60 -o blender-5.2.2.sha256 https://mirror.blender.org/release/Blender5.2/blender-5.2.2.sha256
          fi
          grep 'blender-5.2.2-linux-x64.tar.xz' blender-5.2.2.sha256 | sha256sum -c -
          tar -xf blender-5.2.2-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender522/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - name: Native Blender EGL/Workbench requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgbm1 libx11-6 libxkbcommon0 libxi6 libxfixes3 libxrender1 libxcursor1 libxinerama1
      - name: Source-locked REAL native Blender 3D curves on true original ear surfaces
        shell: bash
        run: |
          set -euo pipefail
          blender -b --python research/animation_v076/original_curve_guided_elephant_ear_roll.py
          test -s v076_curve_ear_rim/V076_ACTUAL_NATIVE_CURVE_GUIDED_EAR_RIM_CANDIDATE.blend
          test -s v076_curve_ear_rim/V076_REAL_CURVE_RIM_SOURCE_AND_TECH_RECEIPT.json
      - name: Independent fresh Blender reopen and saved original no-art-pass gates
        shell: bash
        run: |
          set -euo pipefail
          blender -b v076_curve_ear_rim/V076_ACTUAL_NATIVE_CURVE_GUIDED_EAR_RIM_CANDIDATE.blend --python-expr "import bpy; d=bpy.data.objects; assert d['V076_NEAR_UPPER_EAR_ROLL'].type=='CURVE' and d['V076_FAR_UPPER_EAR_ROLL'].type=='CURVE'; assert len([x for x in bpy.data.images if x.packed_file])>=3; print('V076_ACTUAL_NATIVE_CURVE_FRESH_REOPEN_PASS')"
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path("v076_curve_ear_rim")
          r=json.loads((p/"V076_REAL_CURVE_RIM_SOURCE_AND_TECH_RECEIPT.json").read_text())
          assert r["status"].startswith("NATIVE_TWO_CURVE_EAR_RIM_TECH_PASS")
          assert r["art_approved"] is False and r["ear_body_head_unchanged"]
          assert r["max_full_xyz_world_curve_control_mirror_error"]<1e-7
          assert max(r["mirrored_opposite_original_mesh_surface_distances"])<.055
          for n,h in {**r["before_renders"],**r["after_renders"]}.items():
            assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h
          assert hashlib.sha256((p/"V076_ACTUAL_NATIVE_CURVE_GUIDED_EAR_RIM_CANDIDATE.blend").read_bytes()).hexdigest()==r["saved_blend_sha256"]
          print("V076_TWO_GENUINE_NATIVE_CURVES_RIGHTS_AND_SOURCE_LOCKED; ART_HOLD")
          PY
          find v076_curve_ear_rim -type f -print0 | sort -z | xargs -0 sha256sum > v076_curve_ear_rim/SHA256SUMS.txt
      - name: Preserve real evidence or honest failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v076-real-blender-curve-elephant-ear-rim-evidence
          path: v076_curve_ear_rim/
          retention-days: 7
          if-no-files-found: warn
