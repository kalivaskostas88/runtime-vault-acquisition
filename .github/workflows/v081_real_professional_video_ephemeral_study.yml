name: V081 Actual Original Blender Studio Professional Video Practice Study
on:
  push:
    branches:
      - research/animation-v081-professional-real-video-first-20261119
    paths:
      - .github/workflows/v081_real_professional_video_ephemeral_study.yml
      - research/animation_v081/study_public_teacher_video_ephemeral.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-only-public-video-temporarily:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install official-source study prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Access publicly embedded original segments and sample true frames privately
        run: python research/animation_v081/study_public_teacher_video_ephemeral.py
      - name: Short-lived derived visual study sheets, NOT original source video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v081-temporary-internal-professional-video-contacts
          path: |
            research/animation_v081/V081_REAL_TEACHER_VIDEO_CAPTURE_RECEIPT.json
            research/animation_v081/temporary_private_contact/
          retention-days: 1
          if-no-files-found: warn
