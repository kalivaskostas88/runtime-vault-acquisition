name: V083 Actual Professional Voxel Remesh Lesson Visual Practice Study
on:
  push:
    branches:
      - research/animation-v083-professional-ear-root-source-diagnostic-20261119
    paths:
      - .github/workflows/v083_actual_teacher_remesh_video_study.yml
      - research/animation_v083/capture_professional_remesh_clips_ephemeral.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  professional-video-practice-before-native-modeling:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Use free ffmpeg, Pillow and HTML parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Read authentic publicly embedded professional video clips and derive timestamped contact
        run: python research/animation_v083/capture_professional_remesh_clips_ephemeral.py
      - name: Short-lived private visual study only, not original copyrighted MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v083-kaspar-remesh-actual-private-frame-study
          path: |
            research/animation_v083/V083_REAL_TEACHER_VOXEL_VIDEO_RECEIPT.json
            research/animation_v083/private_transient_visual_frames/
          retention-days: 1
          if-no-files-found: warn
