name: R074 forced language diagnostic
on:
  push:
    branches: [research/woodcarving-r069-cc0]
    paths:
      - '.github/workflows/woodcarving-r074-language-test.yml'
permissions:
  contents: write
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/research/woodcarving-r069-cc0' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded dependencies
        run: |
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1 Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg && command -v ffprobe
      - name: Process licensed source excerpt
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 180 --max-filesize 332428914 --proto '=https' --user-agent 'WoodcarvingResearch/1.0 (educational CC BY-SA capture)' --output "$RUNNER_TEMP/wood.ogv" 'https://upload.wikimedia.org/wikipedia/commons/d/d9/%D0%9A%D0%BE%D0%BF%D0%B0%D0%BD%D0%B8%D1%87%D0%B0%D1%80%D0%B8.ogv'
          python research/woodcarving_r074/language_test.py "$RUNNER_TEMP/wood.ogv" research/woodcarving_r074/evidence
      - name: Persist only attributed excerpt evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/woodcarving_r074/evidence
          git commit -m 'R074 multilingual excerpt diagnostic evidence'
          git push origin HEAD:research/woodcarving-r069-cc0
