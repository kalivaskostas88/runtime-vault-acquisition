name: R076 Yoruba woodcarving documentary overview
on:
  push:
    branches: [research/woodcarving-r069-cc0]
    paths:
      - '.github/workflows/woodcarving-r076-overview.yml'
permissions:
  contents: write
jobs:
  capture:
    if: github.ref == 'refs/heads/research/woodcarving-r069-cc0' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Capture licensed original via sequential decode
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 --max-filesize 34865152 --proto '=https' --user-agent 'WoodcarvingResearch/1.0 (educational CC BY-SA capture)' --output "$RUNNER_TEMP/ise.webm" 'https://upload.wikimedia.org/wikipedia/commons/7/78/Ise_agbegilere.webm'
          /usr/bin/python3 research/woodcarving_r076/capture.py "$RUNNER_TEMP/ise.webm" research/woodcarving_r076/evidence
      - name: Persist attributed contact sheets only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/woodcarving_r076/evidence
          git commit -m 'R076 attributed documentary overview evidence'
          git push origin HEAD:research/woodcarving-r069-cc0
