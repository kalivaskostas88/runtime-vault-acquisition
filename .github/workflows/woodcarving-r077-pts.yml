name: R077 actual timestamp diagnostic
on:
  push:
    branches: [research/woodcarving-r069-cc0]
    paths: ['.github/workflows/woodcarving-r077-pts.yml']
permissions:
  contents: write
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/research/woodcarving-r069-cc0' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Probe source and decode
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 --max-filesize 34865152 --proto '=https' --user-agent 'WoodcarvingResearch/1.0 (educational CC BY-SA capture)' --output "$RUNNER_TEMP/ise.webm" 'https://upload.wikimedia.org/wikipedia/commons/7/78/Ise_agbegilere.webm'
          /usr/bin/python3 research/woodcarving_r077/diagnostic.py "$RUNNER_TEMP/ise.webm" research/woodcarving_r077/evidence
      - name: Persist diagnostic and attributed available evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/woodcarving_r077/evidence
          git commit -m 'R077 diagnostic and available sampled evidence'
          git push origin HEAD:research/woodcarving-r069-cc0
