name: R078 independent audio and timestamped ASR
on:
  push:
    branches: [research/woodcarving-r069-cc0]
    paths: ['.github/workflows/woodcarving-r078-audio.yml']
permissions:
  contents: write
jobs:
  audio:
    if: github.ref == 'refs/heads/research/woodcarving-r069-cc0' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1
      - name: Independent audio
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 --max-filesize 34865152 --proto '=https' --user-agent 'WoodcarvingResearch/1.0 (educational CC BY-SA capture)' --output "$RUNNER_TEMP/ise.webm" 'https://upload.wikimedia.org/wikipedia/commons/7/78/Ise_agbegilere.webm'
          python research/woodcarving_r078/audio.py "$RUNNER_TEMP/ise.webm" research/woodcarving_r078/evidence
      - name: Persist attributed transcript only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/woodcarving_r078/evidence
          git commit -m 'R078 independent audio receipt'
          git push origin HEAD:research/woodcarving-r069-cc0
